function b64ToUtf8(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
const menu=document.getElementById('menu'),stage=document.getElementById('stage'),fr=document.getElementById('fr'),barTitle=document.getElementById('barTitle');
let audioCtx=null;
function unlockAudio(){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0)}}catch(e){}
  try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(' ');u.lang='zh-TW';u.volume=0;speechSynthesis.speak(u)}}catch(e){}
}
function openGame(b64,title){unlockAudio();menu.style.display='none';barTitle.textContent=title;stage.classList.add('on');fr.setAttribute('srcdoc',b64ToUtf8(b64))}
function toMenu(){try{fr.contentWindow.speechSynthesis.cancel()}catch(e){}try{speechSynthesis.cancel()}catch(e){}stage.classList.remove('on');fr.removeAttribute('srcdoc');fr.setAttribute('src','about:blank');menu.style.display=''}
document.getElementById('btnA').onclick=()=>openGame(A64,'經文拼拼樂・God is my helper');
document.getElementById('btnB').onclick=()=>openGame(B64,'英文福音短句拼拼樂・God is my helper');
document.getElementById('back').onclick=toMenu;
</script>
