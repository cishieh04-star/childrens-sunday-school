<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>上帝應許的小寶寶｜英文故事 The Promised Baby</title>
<style>
:root{--u:min(4.4vw,2.7vh,23px);--ink:#1d2b3a;--ink2:#5b6475;--y:#ffd54f;--g:#7bd389;--ok:#2fb86b;--red:#e03131}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1d4a;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:var(--u);touch-action:manipulation;overscroll-behavior:none}
button,select{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:linear-gradient(#0b1d4a 0%,#1d3c78 55%,#3f6fb5 100%);overflow:hidden}
.flake{position:absolute;top:-2em;color:#fff;opacity:.75;pointer-events:none;animation:flk linear infinite;z-index:0}
@keyframes flk{to{transform:translate(4vw,112vh)}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*.6) calc(var(--u)*.8);z-index:1}
.scr.on{display:flex}
.btn{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.6) calc(var(--u)*1);font-weight:800;box-shadow:0 .25em 0 #9fb0cf;font-size:calc(var(--u)*1.02);min-height:calc(var(--u)*2.7)}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #9fb0cf}
.btn.y{background:var(--y);box-shadow:0 .25em 0 #c99a1c}
.btn.g{background:var(--g);box-shadow:0 .25em 0 #3f9a52;color:#0b3d1b}
.btn.r{background:#ffb3b3;box-shadow:0 .25em 0 #d98080}
.btn.b{background:#a9d3ff;box-shadow:0 .25em 0 #6aa2e0}
.btn.big{font-size:calc(var(--u)*1.4);padding:calc(var(--u)*.85)}
.btn.pulse{animation:pulse 1s ease-in-out infinite}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
@keyframes pulse{50%{transform:scale(1.05)}}
.bar{display:flex;gap:calc(var(--u)*.45);align-items:center;flex:none}
.bar .btn{padding:calc(var(--u)*.35) calc(var(--u)*.7);font-size:calc(var(--u)*.92);min-height:calc(var(--u)*2.35);white-space:nowrap}
.bar .sp{flex:1}
.bar .ttl{color:#fff;font-weight:900;font-size:calc(var(--u)*1.15);line-height:1.15;white-space:nowrap}
.bar .sub{color:#d0e0ff;font-size:calc(var(--u)*.8)}
.hide{display:none!important}
/* cover */
#cover{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.8)}
#cover h1{margin:0;color:#fff;font-size:calc(var(--u)*2.5);line-height:1.15;text-shadow:0 .08em 0 #0006}
#cover .en{color:#ffd43b;font-weight:900;font-size:calc(var(--u)*1.5);letter-spacing:.03em}
#cover .art{width:min(92vw,calc(var(--u)*26));aspect-ratio:5/3;border-radius:calc(var(--u)*1);overflow:hidden;box-shadow:0 .4em 1em #0006;border:.2em solid #fff}
#cover .hint{font-weight:900;font-size:calc(var(--u)*1.5);background:#fff;border-radius:99px;padding:.4em 1.4em;box-shadow:0 .2em 0 #9fb0cf;animation:pulse 1.4s infinite}
#cover .vb{position:absolute;top:calc(var(--u)*.6);right:calc(var(--u)*.8)}
/* home tree */
#home{gap:calc(var(--u)*.4)}
#tree{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.topstar{flex:none;font-size:calc(var(--u)*2.4);line-height:1;filter:grayscale(1) brightness(.75)}
.topstar.lit{filter:drop-shadow(0 0 .3em #ffd43b);animation:pulse 1.2s infinite}
.tower{flex:1;min-height:0;width:min(100%,calc(var(--u)*27));display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.25)}
.floor{flex:1;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*.5);background:#2b8a3e;color:#fff;border-radius:calc(var(--u)*.6);padding:0 calc(var(--u)*.6);text-align:left;box-shadow:0 .18em 0 #1b5e20;position:relative;overflow:hidden}
.floor.done{background:#37b24d}
.floor.next{animation:pulse 1.4s ease-in-out infinite;outline:.2em solid #ffd43b}
.floor.boss{background:#c92a2a;box-shadow:0 .18em 0 #8a1c1c}
.floor.lock{opacity:.55;filter:grayscale(.5)}
.floor .orn{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*.95);flex:none;background:#ffffff33;color:#fff;box-shadow:inset 0 0 0 .12em #fff8}
.floor.done .orn{background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--oc) 40%);box-shadow:0 0 .5em var(--oc);color:#fff;text-shadow:0 0 3px #000}
.floor .ic{font-size:calc(var(--u)*1.35);flex:none}
.floor .nm{flex:1;min-width:0;font-weight:800;font-size:calc(var(--u)*1);line-height:1.1}
.floor .nm small{display:block;font-weight:500;font-size:calc(var(--u)*.7);color:#e6fcf5}
.floor.nar .nm small{display:none}
.floor .st{font-size:calc(var(--u)*.85);letter-spacing:-.1em;flex:none}
.trunk{flex:none;width:calc(var(--u)*3);height:calc(var(--u)*.9);background:#8b5a2b;border-radius:0 0 .3em .3em}
.gifts{flex:none;font-size:calc(var(--u)*1.3);line-height:1;margin-top:-.2em}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.45)}
.dock .btn{padding:calc(var(--u)*.45) calc(var(--u)*.2);font-size:calc(var(--u)*.88);line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:.1em}
.dock .btn span{font-size:calc(var(--u)*1.4)}
/* level */
.row2{display:flex;align-items:center;gap:calc(var(--u)*.5);flex:none;margin-top:calc(var(--u)*.4)}
.prog{display:flex;gap:calc(var(--u)*.3);flex:1;min-width:0;align-items:center}
.prog i{flex:1;height:calc(var(--u)*.75);border-radius:99px;background:#fff;box-shadow:0 0 0 .12em #9fb0cf inset}
.prog i.ok{background:var(--ok)}.prog i.bad{background:#ffb347}.prog i.cur{background:var(--y);animation:pulse 1s infinite}
.hud{font-weight:900;font-size:calc(var(--u)*1.05);white-space:nowrap;flex:none;color:#fff}
.hud .bump{display:inline-block;animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
#qwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5);margin:calc(var(--u)*.5) auto 0;background:#fffdf7;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.7);box-shadow:0 .25em 0 #0004;width:100%;max-width:calc(var(--u)*32);overflow:hidden}
.instr{font-size:calc(var(--u)*.85);color:#fff;background:#c92a2a;border-radius:99px;padding:.15em .8em;align-self:flex-start;font-weight:800;flex:none}
.stem{font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.4;text-align:center;flex:none}
.stem .ens{font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold",system-ui,sans-serif;color:#1864ab;font-size:1.05em}
.stem .bl{display:inline-block;min-width:3.2em;border-bottom:.15em solid #e8590c;color:#e8590c;text-align:center}
.zhs{display:block;font-size:calc(var(--u)*.9);color:var(--ink2);font-weight:700;margin-top:.2em}
.fig{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.sbtn{display:inline-flex;align-items:center;gap:.3em;background:#e7f5ff;border-radius:99px;padding:.3em 1em;font-weight:900;box-shadow:0 .18em 0 #74c0fc;color:#1864ab;font-size:calc(var(--u)*1.2)}
.sbtn.huge{font-size:calc(var(--u)*2);padding:.4em 1.2em}
.sbtn:active{transform:translateY(.12em)}
.emo{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo svg{width:1em;height:1em}
.emo.big{font-size:calc(var(--u)*3)}
.emo.huge{font-size:calc(var(--u)*5.5);animation:popin .6s cubic-bezier(.3,1.5,.5,1)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.5);flex:none;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.5) calc(var(--u)*1.5);font-weight:800;font-size:calc(var(--u)*1.35);min-height:calc(var(--u)*3.4);box-shadow:0 .22em 0 rgba(0,0,0,.18);color:#1d2b3a;line-height:1.2;transition:transform .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em}
.opt.c0{background:#ffe27a}.opt.c1{background:#9fd0ff}.opt.c2{background:#ffb1b1}.opt.c3{background:#a8e6b2}
.opt:active{transform:translateY(.15em)}
.opt.hot{outline:.25em solid #1c7ed6;transform:scale(1.04);z-index:2}
.opt.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.opt.ok{background:var(--ok);color:#fff;animation:pop .5s;opacity:1;filter:none}
.opt.no{animation:shake .4s}
.opt .nb{position:absolute;left:.4em;top:.35em;width:1.4em;height:1.4em;border-radius:50%;background:#fff9;font-size:.6em;display:grid;place-items:center;font-weight:900}
.opt .ew{font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold",system-ui,sans-serif;font-size:1.1em}
.opt.pic{padding:calc(var(--u)*.35)}
.thumb{display:block;width:100%;aspect-ratio:5/3;border-radius:.45em;overflow:hidden;background:#0a1a44}
.thumb svg{width:100%;height:100%;display:block}
@keyframes pop{40%{transform:scale(1.1)}}
@keyframes shake{20%{transform:translateX(-.3em)}60%{transform:translateX(.3em)}}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.fb{flex:none;min-height:calc(var(--u)*2);text-align:center;font-weight:800;font-size:calc(var(--u)*1.05);color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap}
.fb.ok{color:var(--ok)}.fb.bad{color:#c2410c}
.fb .ens{font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;color:#1864ab}
/* spell */
.slots{display:flex;gap:calc(var(--u)*.35);justify-content:center;flex-wrap:wrap;flex:none}
.slot{width:calc(var(--u)*2.7);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.9);color:#c5ccd6;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
.slot.cur{border-color:#ff9f1c;background:#fff6dc;animation:pulse 1s infinite}
.slot.f{background:#e8f9ee;border:.15em solid var(--ok);color:#0b6b36;animation:pop .4s}
.hand{display:flex;gap:calc(var(--u)*.45);justify-content:center;flex-wrap:wrap;margin-top:auto;flex:none}
.tile{width:calc(var(--u)*3.2);height:calc(var(--u)*3.6);border-radius:calc(var(--u)*.7);background:linear-gradient(#fff,#e7f5ff);font-weight:900;font-size:calc(var(--u)*1.9);box-shadow:0 .22em 0 #74a7d6;border:.12em solid #a5d8ff;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
.tile.used{opacity:.2;pointer-events:none}
.tile.no{animation:shake .4s;background:#ffe3e3}
.tile.hint{animation:pulse .8s infinite;background:#fff3bf;box-shadow:0 0 0 .2em #ffd43b}
/* order */
.oslots{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.4);flex:none}
.oslot{border-radius:.6em;border:.15em dashed #8aa;background:#f1f3f5;aspect-ratio:5/3;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.5);color:#adb5bd;overflow:hidden;position:relative}
.oslot.f{border:.15em solid var(--ok);animation:pop .4s}
.oslot .thumb{position:absolute;inset:0;border-radius:0;aspect-ratio:auto;height:100%}
.ocards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.4);margin-top:auto;flex:none}
.ocard{background:#fff;border-radius:.7em;padding:.25em;box-shadow:0 .2em 0 #9fb0cf;display:flex;flex-direction:column;gap:.2em;align-items:stretch;font-weight:800;font-size:calc(var(--u)*.85);line-height:1.15;color:#1864ab;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
.ocard small.z{display:block;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:#495057;font-size:.85em;margin-top:.15em}
.ocard.used{opacity:.25;pointer-events:none}
.ocard.no{animation:shake .4s}
.ocard.hint{box-shadow:0 0 0 .25em #ffd43b;animation:pulse .8s infinite}
.ocard.hot{outline:.22em solid #1c7ed6}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.45) calc(var(--u)*1);flex:1;align-content:center}
.mt button{background:#fff;border-radius:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.25);min-height:calc(var(--u)*3.1);box-shadow:0 .18em 0 #b8c4dc;padding:.2em .4em;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;color:#1864ab}
.mt button .emo{font-size:calc(var(--u)*2)}
.mt button.sel{background:#fff3b0;outline:.2em solid #ffb400}
.mt button.done{background:var(--ok);color:#fff;pointer-events:none}
.mt button.no{animation:shake .4s}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(5,15,45,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(var(--u)*1)}
.ov.on{display:flex}
.panel{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1);width:min(100%,calc(var(--u)*26));display:flex;flex-direction:column;gap:calc(var(--u)*.55);box-shadow:0 .4em 0 #0003;max-height:96%;overflow:auto}
.panel h2{margin:0;text-align:center;font-size:calc(var(--u)*1.45)}
.panel .sub{color:var(--ink2);line-height:1.4}
.seg{display:flex;gap:calc(var(--u)*.4)}
.seg .btn{flex:1;padding:calc(var(--u)*.4) calc(var(--u)*.2);font-size:calc(var(--u)*.95)}
.seg .btn.sel{background:var(--y);box-shadow:0 .25em 0 #c99a1c}
.row{display:flex;align-items:center;gap:calc(var(--u)*.5);justify-content:space-between;font-weight:700}
/* result */
#result{align-items:center;gap:calc(var(--u)*.6)}
#result .bar{align-self:stretch}
#rbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.55);text-align:center;width:min(100%,calc(var(--u)*28));color:#fff}
#rbody .ttl{font-weight:900;font-size:calc(var(--u)*1.8)}
.rsub{font-weight:700;font-size:calc(var(--u)*1.1);color:#e7f0ff;line-height:1.4}
.bigic{font-size:calc(var(--u)*4.6);line-height:1}
.rstars{display:flex;gap:calc(var(--u)*.4);font-size:calc(var(--u)*3);line-height:1}
.rstars span{color:#5c6f99;transform:scale(.3);opacity:0;animation:starin .5s forwards}
.rstars span.on{color:#ffd43b;text-shadow:0 0 .3em #ffd43b}
@keyframes starin{60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
.balls{display:flex;gap:.25em;font-size:calc(var(--u)*1.5)}
.balls i{font-style:normal;opacity:0;animation:popin .5s forwards}
#rbtns{flex:none;display:flex;gap:calc(var(--u)*.6);flex-wrap:wrap;justify-content:center;width:100%;padding-bottom:calc(var(--u)*.4)}
#rbtns .btn{min-width:calc(var(--u)*8)}
.intro{margin:auto;text-align:center;display:flex;flex-direction:column;gap:calc(var(--u)*.6);padding:calc(var(--u)*1.5);animation:popin .6s}
.intro .ttl{font-weight:900;font-size:calc(var(--u)*1.5)}
.intro .sub{color:var(--ink2)}
/* group */
.teams{display:grid;gap:calc(var(--u)*.45);flex:none;margin-top:calc(var(--u)*.4)}
.team{border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.3) calc(var(--u)*.6);color:#222;font-weight:800;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.5);min-height:calc(var(--u)*2.5)}
.team.cur{outline:.25em solid #fff;box-shadow:0 0 0 .45em #ff9f1c;transform:scale(1.03)}
.team b{font-size:calc(var(--u)*1.3)}
.team .gf{font-size:calc(var(--u)*.85);letter-spacing:-.15em;max-width:50%;overflow:hidden;white-space:nowrap}
/* effects */
.confe{position:fixed;top:-3em;z-index:90;pointer-events:none;font-size:calc(var(--u)*1.8);animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*1.4);font-weight:900;font-size:calc(var(--u)*1.8);box-shadow:0 .3em 0 #0003;animation:toast 1.4s forwards;pointer-events:none;text-align:center}
@keyframes toast{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
/* ===== 故事教室 ===== */
#clsTabs{display:flex;gap:calc(var(--u)*.35);margin-top:calc(var(--u)*.45);flex:none}
#clsTabs .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding:calc(var(--u)*.35) calc(var(--u)*.2);font-size:calc(var(--u)*.95);min-height:calc(var(--u)*2.4)}
#clsTabs .btn.sel{background:var(--y);box-shadow:0 .25em 0 #c99a1c}
#clsStage{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:calc(var(--u)*.45)}
.story,.vc,.fl{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.4)}
.sv-top{flex:none;display:flex;gap:calc(var(--u)*.4);align-items:center}
.sv-top select{flex:1;min-width:0;font-weight:900;font-size:calc(var(--u)*.95);padding:calc(var(--u)*.3) calc(var(--u)*.5);border-radius:calc(var(--u)*.7);background:#fff8db;border:2px solid #f0c040;color:#1d2b3a}
.sv-pg{flex:none;color:#fff;font-weight:900;font-size:calc(var(--u)*.95)}
.sv-scene,.fl-scene{flex:1 1 0;min-height:calc(var(--u)*7);border-radius:calc(var(--u)*.9);overflow:hidden;background:#0a1a44;box-shadow:0 .2em 0 #0005;border:.15em solid #fff;position:relative}
.sv-scene svg,.fl-scene svg{width:100%;height:100%;display:block}
.sv-en,.fl-en{flex:none;background:#fffdf3;border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.45) calc(var(--u)*.7);font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;font-size:calc(var(--u)*1.4);line-height:1.55;color:#1d2b3a;box-shadow:0 .2em 0 #c9b98a;text-align:center;min-height:3.4em;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 .32em;position:relative}
.sv-en.talk::before,.fl-en.talk::before{content:'🔊';position:absolute;left:.3em;top:.1em;font-size:.75em;animation:pulse .9s infinite}
.w{border-radius:.25em;padding:0 .08em;transition:background .15s,color .15s;cursor:pointer}
.w.on{background:#ffd43b;color:#7a1f00;box-shadow:0 0 0 .08em #ffd43b}
.w.past{color:#1864ab}
.w.tap{background:#b2f2bb}
.w[data-k]{border-bottom:.08em dotted #74c0fc}   /* 虛線：表示這個字可以點 */
.w.blink{animation:wblink .65s ease-in-out 4}
@keyframes wblink{50%{background:#ffd43b;color:#7a1f00}}
button.zh-w{display:block;width:100%;text-align:left;background:none;border:0;padding:.15em 0;font:inherit;font-size:.92em;color:#ffe8a3;cursor:pointer}
button.zh-w small{opacity:.8;font-size:.8em}
.sv-en.ttl{font-size:calc(var(--u)*1.8);color:#c92a2a}
.sv-zh,.vc-zh,.fl-zh{flex:none;background:#2b3f73;border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.3) calc(var(--u)*.6);color:#fff;font-size:calc(var(--u)*.92);line-height:1.45;border:.12em dashed #8fb3ff}
.sv-zh .lb,.fl-zh .lb,.vc-zh .lb{display:inline-block;background:#ffd43b;color:#1d2b3a;border-radius:.4em;padding:0 .4em;font-size:.8em;font-weight:900;margin-right:.4em}
.sv-zh.say{background:#3b5bab}
.zh-w{font-size:.92em;color:#ffe8a3;margin-top:.1em}

<script>
/* =====================================================================
   上帝應許的小寶寶｜英文故事 The Promised Baby（以賽亞的預言、耶穌誕生、耶穌奇妙的名字）
   ---------------------------------------------------------------------
   畫面：封面 → 首頁（星星小路，一步一步玩）→ 遊戲／故事教室／結果
   故事教室：說故事（先唸完英文，再唸完中文）、單字卡、跟我唸、聖經金句（以賽亞書 9:6、路加福音 2:14）
   語音：英文用一般的英文聲音，中文用國語聲音
   遊戲：只考簡單的單字（不考人名），每題、每個選項都會唸出來
   獎勵：點數、角色、商店都只在畫面上，不需要列印
   要改故事內容：改下面的 STORY；要改考的單字：改 GV、SPELL、FILL；經文：改 LOVE
   ===================================================================== */
'use strict';
/* 從 LINE 打開時：自動改用手機的瀏覽器（Safari／Chrome）打開，LINE 裡面的瀏覽器常常沒有語音 */
(function(){try{const ua=navigator.userAgent||'';if(/\bLine\//i.test(ua)&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.href.replace(/#.*$/,'')+(location.search?'&':'?')+'openExternalBrowser=1'+location.hash)}}catch(e){}})();
/* 手機唸不出聲音時，出現提醒（給大人看） */
function ttsWarn(){
  if(ttsWarn.shown||!S.voice)return;ttsWarn.shown=true;
  const inApp=/\bLine\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(navigator.userAgent||'');
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:3%;right:3%;bottom:3%;z-index:99;background:#fff8d6;color:#1d2b3a;border:3px solid #f0c040;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;box-shadow:0 6px 18px #0006;font-weight:700';
  d.innerHTML='🔇 <b>這台手機現在沒有唸出聲音</b><br>'+(inApp?'👉 請不要在 LINE／Facebook 裡面打開。請按右上角「⋯」，選「用瀏覽器開啟」。<br>':'')+
    '👉 請檢查：手機音量（媒體音量）有開大、iPhone 側邊的靜音鍵沒有打開。<br>👉 建議用 <b>Chrome</b>（安卓）或 <b>Safari</b>（iPhone）打開。<br><button style="margin-top:8px;padding:6px 18px;border-radius:12px;background:#ffd54f;font-weight:900;font-size:16px">知道了</button>';
  d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seedRand(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const old=Math.random;Math.random=seedRand(seed);try{return fn()}finally{Math.random=old}}
const NUMZH=['零','一','二','三','四','五','六','七','八','九','十','十一','十二'];

/* ================= 設定（點數、速度會記住；過關只存在這次開啟） ================= */
let _store=null;try{_store=window.localStorage}catch(e){}
function sget(k,d){try{const v=_store&&_store.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sset(k,v){try{_store&&_store.setItem(k,JSON.stringify(v))}catch(e){}}
const S={voice:true,rate:sget('jesus2-rate',0.6),count:6,sfx:true,done:{},stars:{},unlockAll:true};
const dayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};

/* ================= 排程（可暫停） ================= */
const CLK={paused:false,pend:[]};
function later(fn,ms){return setTimeout(()=>{if(CLK.paused)CLK.pend.push(fn);else fn()},ms)}
function setPaused(p){CLK.paused=p;if(p){TTS.stop()}else{const q=CLK.pend;CLK.pend=[];q.forEach(f=>f())}}
let _lastTap=0;
function guard(ms){const n=Date.now();if(n-_lastTap<ms)return false;_lastTap=n;return true}

/* ================= 語音：英文用英文聲音、中文用國語聲音 ================= */
// 中文唸法修正：數綿羊的「數」唸ㄕㄨˇ
function zhSpoken(s){return String(s).replace(/數綿羊/g,'鼠綿羊').replace(/在數/g,'在鼠').replace(/數一數/g,'鼠一鼠')
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍①②③④⑤⑥○✕✔]/gu,'').replace(/＿+|_{2,}/g,'空格').replace(/\s+/g,' ')}
function enSpoken(s){return String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}️‍]/gu,'').replace(/—/g,', ').replace(/_{2,}/g,' blank ').replace(/\s+/g,' ')}
// vEn：一般英文聲音；vGirl：說故事用的英文女聲（再把音調調高，聽起來像外國小女孩）；vZh：國語聲音
const TTS={ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',gen:0,vEn:null,vGirl:null,vZh:null,
  // 停止語音；如果剛剛有在唸，記下停止的時間（Safari 剛停完馬上再唸會沒有聲音，要等一下）
  stop(){try{if(this.ok&&(speechSynthesis.speaking||speechSynthesis.pending))this.cut=Date.now()}catch(e){}this.gen++;try{this.ok&&speechSynthesis.cancel()}catch(e){}},
  est(t,en){return Math.max(450,String(t).length*(en?78:260)/S.rate)},
  // 唸一段話：en=英文、girl=用小女孩的聲音（只有說故事用）、onB=唸到哪個字的通知、rm=速度倍數
  one(text,en,gen,done,onB,rm,girl,_try){
    if(gen!==this.gen)return;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(tm);done&&done()};
    const est=this.est(text,en)/(rm||1);

function wordHL(W,txt,alive,rm){ // W：每個字的位置
  W.forEach(w=>w.el.classList.remove('on','past'));
  let real=false,started=false;const tms=[];
  const mark=k=>W.forEach((w,j)=>{w.el.classList.toggle('on',j===k);w.el.classList.toggle('past',j<k)});
  const start=()=>{if(started)return;started=true;const dur=TTS.est(txt,true)/(rm||1)*.9,L=txt.length||1;W.forEach((w,j)=>tms.push(setTimeout(()=>{if(!real&&alive())mark(j)},dur*w.s/L)))};
  const kick=setTimeout(start,900);
  return {start,
    b:ci=>{if(ci<0){start();return}real=true;tms.forEach(clearTimeout);let k=-1;for(let j=0;j<W.length;j++)if(ci>=W[j].s)k=j;if(k>=0&&alive())mark(k)},
    end:()=>{clearTimeout(kick);tms.forEach(clearTimeout);W.forEach(w=>{w.el.classList.remove('on');w.el.classList.add('past')})},
    kill:()=>{clearTimeout(kick);tms.forEach(clearTimeout)}};
}

    const it=items[st.i],g=it.gap!=null?it.gap:gap;
    if(st.called<st.i){st.called=st.i;it.on&&it.on()}

    st.hl&&st.hl.kill();st.hl=it.words?wordHL(it.words,txt,()=>gen===TTS.gen&&ep===st.ep,it.rm):null;const hl=st.hl;

let AC=null;

//   每一小段分開唸，中間停一下，小朋友比較聽得清楚
function buildWords(text,host,keyW){
  const toks=String(text).replace(/—/g,'— ').split(/\s+/).filter(Boolean);
  let h='';const W=[],chunks=[];let cur=null;
  const nc=()=>{if(!cur||cur.W.length){cur={sp:'',W:[]};chunks.push(cur)}};nc();
  toks.forEach(tk=>{
    if(tk==='/'){nc();return}
    const clean=tk.replace(/—/g,'');
    if(!clean){h+=`<span class="w">—</span>`;return}
    const key=keyW&&normW(clean).indexOf(keyW)===0?' key':'';
    h+=`<span class="w${key}" data-k="${W.length}">${esc(tk.replace(/—$/,''))}${/—$/.test(tk)?'—':''}</span> `;
    const s0=cur.sp.length?cur.sp.length+1:0;cur.sp+=(cur.sp.length?' ':'')+clean;
    const w={s:s0,e:cur.sp.length,t:clean,raw:tk};W.push(w);cur.W.push(w);
    if(/[,.!?:;—]["”]?$/.test(tk))nc();   // 標點符號後面斷開
  });
  host.innerHTML=h;
  const els=$$('.w[data-k]',host);W.forEach((w,j)=>w.el=els[j]);
  const cs=chunks.filter(c=>c.W.length);
  return {spoken:cs.map(c=>c.sp).join(' '),W,chunks:cs};
}

}

function mixItems(text,onFirst,onLast){

}

/* ---- 說故事 ---- */

/* ---- 拉把：英文和中文接在同一條上 ----
   「先英文再中文」：左半段＝英文故事（封面～第11頁），右半段＝中文故事（封面～第11頁）
   「每頁英＋中」：只有一段，每一頁都是英文接中文 */
function svSteps(){return CL.mode==='all'?STORY.length*2:STORY.length}
function svPos(){return (CL.mode==='all'&&CL.phase==='zh'?STORY.length:0)+CL.pg}
function svGoPos(v){const n=STORY.length;if(CL.mode==='all')svShow(v%n,v>=n?'zh':'en');else svShow(v)}
function svScrubSetup(){
  const box=$('#svScrubBox');if(!box)return;
  const n=STORY.length,N=svSteps(),pct=k=>k/(N-1)*100,two=CL.mode==='all';
  box.innerHTML=`<div class="scr-row"><button class="btn scr-arr" id="svBack" aria-label="上一頁">◀</button><div class="scrub"><div class="scr-track">${two?`<i class="scr-half" style="left:0;width:${pct(n-.5)}%"></i><i class="scr-half zh" style="left:${pct(n-.5)}%;right:0"></i>`:''}<i class="scr-fill" id="svFill"></i>${Array.from({length:N},(_,k)=>`<b class="scr-tick${two&&k===n?' mid':''}" style="left:${pct(k)}%"></b>`).join('')}</div><input type="range" id="svScrub" min="0" max="${N-1}" step="1" value="0" aria-label="拖拉選頁"><div class="scr-tip" id="svTip" hidden></div></div><button class="btn scr-arr" id="svFwd" aria-label="下一頁">▶</button></div>`
   +(two?`<div class="scr-lab"><span>🔤 英文故事</span><span>🀄 中文故事</span></div>`:'')
   +`<div class="scr-how">👆 拖拉圓點，或按 ◀ ▶ 換頁</div>`;
  const r=$('#svScrub'),tip=$('#svTip');let drag=false,tm=null;
  const lab=v=>{const pg=v%n,zh=two&&v>=n;return (two?(zh?'中文　':'英文　'):'')+(pg?`第${pg}頁：${zh?STORY[pg].cz:STORY[pg].cap}`:'封面')};
  const showTip=v=>{tip.textContent=lab(v);tip.hidden=false;const p=v/(N-1);tip.style.left=`clamp(0px, calc(${p*100}% - ${tip.offsetWidth/2}px), calc(100% - ${tip.offsetWidth}px))`;$('#svFill').style.width=pct(v)+'%'};
  r.addEventListener('pointerdown',()=>{drag=true;showTip(+r.value)});
  r.addEventListener('input',()=>{drag=true;showTip(+r.value)});
  const rel=()=>{if(!drag)return;drag=false;tip.hidden=true;spUnpause();svGoPos(+r.value)};
  r.addEventListener('change',rel);['pointerup','touchend','mouseup'].forEach(t=>r.addEventListener(t,()=>setTimeout(rel,30)));
  const nud=d=>{const v=Math.max(0,Math.min(N-1,(drag?+r.value:svPos())+d));r.value=v;drag=true;showTip(v);clearTimeout(tm);tm=setTimeout(()=>{drag=false;tip.hidden=true;spUnpause();svGoPos(v)},900)};
  $('#svBack').onclick=()=>nud(-1);$('#svFwd').onclick=()=>nud(1);
}
// 顯示第 i 頁並唸出來；ph 可以指定要唸英文('en')或中文('zh')
function svShow(i,ph){
  if(ph)CL.phase=ph;
  const tok=++CL.tok;TTS.stop();CL.pg=i;const p=STORY[i];
  const zhTurn=CL.mode==='all'&&CL.phase==='zh';   // 正在唸中文的那一輪
  $('#svScene').innerHTML=SCN(i);
  const big=$('#svEn'),low=$('#svZhT');
  big.classList.toggle('ttl',i===0);big.classList.toggle('zhm',zhTurn);
  let bw;
  if(zhTurn){
    // 唸中文：右邊大框放中文；英文搬到圖片下方（一樣可以點單字）
    big.innerHTML=`<span>${esc(p.zh)}</span>`;
    $('#svLb').textContent='英文';low.classList.add('enlow');bw=buildWords(p.en,low);
  }else{
    // 唸英文：右邊大框放英文；圖片下方放中文
    $('#svLb').textContent='中文';low.classList.remove('enlow');low.textContent=p.zh;bw=buildWords(p.en,big);
  }
  $('#svZhW').innerHTML=HINTW;CL.lastW=null;
  $('#svPg').textContent=(i?`${i} / ${LASTP}`:'封面')+(CL.mode==='all'?(zhTurn?'　中文':'　英文'):'');$('#svSel').value=i;
  const N=svSteps(),pos=svPos(),r=$('#svScrub');if(r){r.value=pos;$('#svFill').style.width=(pos/(N-1)*100)+'%'}
  const nx=$('#svNext');nx.textContent=i<LASTP?'下一頁 ▶':(CL.mode==='all'&&!zhTurn?'中文故事 ▶':'🔁 從頭再聽');nx.classList.remove('pulse');$('#svAgain').classList.remove('pulse');
  bw.W.forEach(w=>w.el.onclick=e=>{e.stopPropagation();if(!guard(250))return;svWord(w)});
  // 英文：一個字一個字亮起來
  const enIt=enItems(bw,{rm:i===0?.85:1,on:()=>big.classList.add('talk')});   // 一小段一小段唸
  // 中文：唸中文的那一輪，右邊大框亮；「每頁英＋中」時，圖片下方的中文框亮
  const zhIt={t:p.zh,gap:500,on:()=>{if(zhTurn)big.classList.add('talk');else{big.classList.remove('talk');$('#svZh').classList.add('say')}}};
  let it;
  if(CL.mode==='page')it=[...enIt,zhIt];
  else if(zhTurn)it=[zhIt];
  else it=enIt;
  // 這一頁的音效、角色動作的聲音，放完再開始唸
  const sfxIt={t:'',gap:p.sfx?1300:250,on:()=>{try{if(p.sfx&&PSFX[p.sfx]&&ac())PSFX[p.sfx]()}catch(e){}(p.act||[]).forEach(a=>setTimeout(()=>{if(tok===CL.tok)actSnd(a[1])},a[2]||0))}};
  it=[sfxIt,...it];
  const theEnd=i===LASTP&&(CL.mode==='page'||zhTurn);
  if(theEnd)it.push({t:'故事說完了！你可以點英文單字，聽聽它的意思；也可以回首頁玩英文遊戲喔！',on:()=>{SFX.jingle();confetti(26,['🎄','❤️','⭐','❄️','🎁'])}});
  CL.done=false;   // 這一頁還沒唸完
  speakSeq(it,()=>{if(tok!==CL.tok)return;CL.done=true;big.classList.remove('talk');const z=$('#svZh');z&&z.classList.remove('say');
    if(!CL.auto||theEnd){$('#svNext').classList.add('pulse');return}
    const alive=()=>tok===CL.tok&&CURSCR==='class'&&CL.tab===0;
    if(i<LASTP)later(()=>{if(alive())svShow(i+1)},1800);
    // 英文故事唸完了，換中文從封面開始唸
    else later(()=>{if(!alive())return;speakSeq([{t:'英文故事唸完了！接下來，我們用中文再聽一次。'}],()=>{if(alive())svShow(0,'zh')})},1500);

        if(PT.d.own.includes(s[0])){PT.d.wear=s[0];ptSave();ptRefresh();SFX.swap();speakSeq([`${chN()}帶上了${s[1]}。`]);tab('s');return}
        if(PT.d.pts<s[2]){SFX.bad();speakSeq([`${s[1]}要${s[2]}點，還差${s[2]-PT.d.pts}點。多答對幾題就可以買了！`]);b.classList.remove('no');void b.offsetWidth;b.classList.add('no');return}
        PT.d.pts-=s[2];PT.d.own.push(s[0]);PT.d.wear=s[0];ptSave();ptRefresh();SFX.fanfare();confetti(24,[s[0],'✨','⭐']);speakSeq([`買到了${s[1]}！${chN()}帶上了${s[1]}。`]);tab('s')})}
    else{body.innerHTML=PT.d.own.length?`<div class="sub" style="text-align:center">點一下，讓角色帶上這個寶物</div><div class="shopg">${PT.d.own.map(e=>{const s=PT_SHOP.find(x=>x[0]===e)||[e,''];return `<button class="shb ${PT.d.wear===e?'sel':''}" data-e="${e}"><span>${e}</span><small>${s[1]}</small></button>`}).join('')}<button class="shb" data-e=""><span>🚫</span><small>不帶</small></button></div>`:`<div class="ptempty">還沒有寶物。<br>答對題目得到點數，就可以到「獎勵商店」買喔！</div>`;
      body.querySelectorAll('.shb').forEach(b=>b.onclick=()=>{PT.d.wear=b.dataset.e||null;ptSave();ptRefresh();SFX.tap();tab('b')})}};
  p.querySelectorAll('.ptabs .btn').forEach(b=>b.onclick=()=>{SFX.tap();tab(b.dataset.t);speakSeq([b.dataset.t==='c'?'選一個你喜歡的角色。':b.dataset.t==='s'?`你有${PT.d.pts}點。點一個寶物，就可以用點數買。`:'這些是你買到的寶物。'])});
  p.querySelector('#ptOk').onclick=()=>{if(!PT.d.ch){PT.d.ch=PT_CHARS[0][0];ptSave()}ptRefresh();TTS.stop();ov.classList.remove('on')};
  tab('c');ov.classList.add('on');
  speakSeq([first?'選一個你喜歡的角色。答對題目，可以得到點數喔！':'選一個你喜歡的角色。']);
}

/* ================= 初始化 ================= */
function init(){
  for(let i=0;i<16;i++){const f=document.createElement('div');f.className='flake';f.textContent=i%3?'✦':'·';f.style.left=Math.random()*100+'vw';f.style.fontSize=(10+Math.random()*16)+'px';f.style.animationDuration=(9+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*15)+'s';$('#app').prepend(f)}
  initCover();
  $$('.vbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleVoice()});syncVoice();
  $('#dkClass').onclick=()=>{if(guard(350))openClass()};
  $('#dkGroup').onclick=()=>{if(guard(350))openGroupSetup()};
  $('#dkDaily').onclick=()=>{if(guard(350))startDaily()};
  $('#dkSet').onclick=()=>{if(guard(350))openSettings()};
  $('#lvHome').onclick=()=>{if(guard(300))askExit()};
  $('#lvPause').onclick=()=>{if(guard(300))pauseGame()};
  $('#lvListen').onclick=()=>{if(!guard(300)||CLK.paused)return;if(!qmSkip())qmReplay()};
  $('#clsHome').onclick=()=>{TTS.stop();go('home')};
  $$('#clsTabs .btn').forEach((b,i)=>b.onclick=()=>{if(!guard(300))return;CL.tab=i;SFX.tap();renderClass()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(CURSCR==='level'&&!CLK.paused)pauseGame();else if(CURSCR==='class'&&!SP.paused&&SP.cur)spPause();else TTS.stop()}});
  const bar=$('#home .bar'),sp=bar&&bar.querySelector('.sp');if(sp)sp.insertAdjacentHTML('afterend','<button class="btn ptchip" id="ptChip"></button>');
  $('#ptChip').onclick=()=>{if(guard(350))openChar(false)};
  $('#level .row2').insertAdjacentHTML('afterbegin','<div id="avBox"></div>');
  ptRefresh();
  window.__X={S,go,startFloor,startBoss,startDaily,startGroup,openClass,QM,LV,CL,renderClass,svShow,SCN};
  go('cover');
}
init();
</script>
