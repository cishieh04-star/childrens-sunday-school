const svgDino=c=>`<svg viewBox="0 0 160 100"><path d="M22 62 Q2 62 2 84 Q16 70 32 76Z" fill="${c}"/><rect x="34" y="72" width="16" height="25" rx="7" fill="${c}"/><rect x="58" y="74" width="16" height="23" rx="7" fill="${c}" opacity=".85"/><rect x="88" y="74" width="16" height="23" rx="7" fill="${c}" opacity=".85"/><rect x="108" y="72" width="16" height="25" rx="7" fill="${c}"/><ellipse cx="78" cy="62" rx="52" ry="28" fill="${c}"/><path d="M110 50 Q134 44 136 22" stroke="${c}" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="140" cy="16" r="13" fill="${c}"/><circle cx="145" cy="12" r="3.5" fill="#222"/><path d="M144 22 q4 2 7 0" stroke="#0005" stroke-width="2" fill="none"/></svg>`;
const svgFish=c=>`<svg viewBox="0 0 160 100"><path d="M34 50 L4 18 Q12 50 4 82Z" fill="${c}"/><ellipse cx="88" cy="50" rx="58" ry="36" fill="${c}"/><path d="M66 18 Q88 0 110 18Z" fill="${c}" opacity=".8"/><circle cx="128" cy="40" r="8" fill="#fff"/><circle cx="130" cy="40" r="4" fill="#222"/><path d="M142 56 Q148 60 144 66" stroke="#0005" stroke-width="2" fill="none"/><path d="M60 78 Q88 92 112 78" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none"/></svg>`;
const svgCar=c=>`<svg viewBox="0 0 160 100"><rect x="4" y="14" width="152" height="52" rx="8" fill="${c}"/><rect x="4" y="56" width="152" height="10" fill="rgba(0,0,0,.18)"/><rect x="0" y="66" width="160" height="6" rx="3" fill="#555"/><circle cx="36" cy="78" r="12" fill="#333"/><circle cx="36" cy="78" r="4.5" fill="#bbb"/><circle cx="124" cy="78" r="12" fill="#333"/><circle cx="124" cy="78" r="4.5" fill="#bbb"/><rect x="152" y="58" width="8" height="5" fill="#333"/></svg>`;
const svgLoco=()=>`<svg viewBox="0 0 160 100"><circle cx="30" cy="8" r="7" fill="#fff" opacity=".8"/><circle cx="42" cy="0" r="5" fill="#fff" opacity=".6"/><rect x="24" y="12" width="16" height="26" fill="#333"/><rect x="4" y="34" width="112" height="32" rx="8" fill="#e53935"/><rect x="92" y="14" width="48" height="52" rx="6" fill="#c62828"/><rect x="100" y="22" width="32" height="20" rx="3" fill="#8fd3ff"/><rect x="0" y="66" width="160" height="6" rx="3" fill="#555"/><circle cx="30" cy="78" r="13" fill="#333"/><circle cx="30" cy="78" r="5" fill="#bbb"/><circle cx="76" cy="78" r="13" fill="#333"/><circle cx="76" cy="78" r="5" fill="#bbb"/><circle cx="122" cy="78" r="13" fill="#333"/><circle cx="122" cy="78" r="5" fill="#bbb"/></svg>`;
const SVG={truck:svgTruck,dino:svgDino,fish:svgFish,car:svgCar};
const LB={truck:[7,13,55,52],dino:[24,34,50,44],fish:[22,27,54,46],car:[6,16,88,46]};
const lbHTML=(k,c,h,font)=>{const b=LB[k];return `<div class="lb" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%;font-size:${h*.38}px;font-family:${font}">${c}</div>`};
function playSide(kind){const fld=$('#fld');let W,H,w,h,rows;
  const lanes=[];
  const mk=()=>{W=fld.clientWidth;H=fld.clientHeight;rows=H>=760?4:(H>=W*.9||H>=420)?3:2;w=Math.max(90,Math.min(250,W/2.3,(H*.94/rows)/.62));h=w*.62;
    lanes.forEach(e=>e.remove());lanes.length=0;
    if(kind!=='fish')for(let r=0;r<rows;r++){const e=document.createElement('div');e.className='ln '+kind;e.style.cssText=`top:${rowY(r)+h*.66}px;height:${h*.4}px`;fld.insertBefore(e,fld.firstChild);lanes.push(e)}};
  const rowY=r=>(H-rows*h)/(rows+1)*(r+1)+r*h;
  mk();window.onresize=mk;
  if(kind==='fish')fld.insertAdjacentHTML('afterbegin','<div class="bub" style="left:12%">🫧</div><div class="bub" style="left:48%;animation-delay:2s">🫧</div><div class="bub" style="left:80%;animation-delay:4s">🫧</div>');
  const items=[];let spawn=.2;
  loop(dt=>{if(!G||!G.live)return;G.idle+=dt;spawn-=dt;const live=items.filter(i=>!i.dead);
    if(spawn<=0&&live.length<rows*2+1){const needT=!live.some(i=>i.t);const t=needT||Math.random()<.3;
      const free=[...Array(rows).keys()].filter(r=>!items.some(i=>!i.remove&&i.r===r&&(i.dir>0?i.x<w*1.3:i.x>W-w*2.3)));
      if(free.length){const r=one(free),dir=r%2===0?1:-1,c=t?G.c:pickDis(G.c),col=one(kind==='fish'?['#ff8a65','#ffca28','#ab47bc','#26c6da','#ef5350']:COLS),font=one(FONTS);
        const el=document.createElement('div');el.className='it sd';el.style.cssText=`width:${w}px;height:${h}px`;
        el.innerHTML=`<div class="sv2 ${dir<0?'fl':''}">${SVG[kind](col)}</div>${lbHTML(kind,c,h,font)}`;fld.appendChild(el);
        const it={el,c,t,r,dir,x:dir>0?-w:W,ph:Math.random()*6,sp:.85+Math.random()*.3,dead:false};items.push(it);
        el.addEventListener('pointerdown',e=>{e.preventDefault();if(it.dead||!G.live)return;
          if(it.t){it.dead=false;it.done=true;const lb=el.querySelector('.lb');lb.classList.add('pop');sfx('hit');hit(el);it.dead=true;it.keep=true}else{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),420);miss(el,it.c)}});
        spawn=(.8+Math.random()*.4)*(TT()/11)**.5}else spawn=.3}
    const v=(W+w)/(TT()*.8);
    for(const it of items){if(it.remove)continue;it.x+=it.dir*v*it.sp*dt;
      const bob=Math.sin(it.ph+it.x/50)*(kind==='fish'?h*.09:kind==='dino'?h*.035:h*.015);
      it.el.style.transform=`translate(${it.x}px,${rowY(it.r)+bob}px)`;
      if(it.x>W+w*1.1||it.x<-w*1.2){it.remove=true;it.dead=true;it.el.remove()}}
    for(const it of items)if(!it.dead)it.el.classList.toggle('glow',it.t&&G.idle>8);
    if(items.length>30)items.splice(0,items.length-12)})}
function playTrain(){const fld=$('#fld');let W,H,cw,ch,tracks;
  const mk=()=>{W=fld.clientWidth;H=fld.clientHeight;cw=Math.max(70,Math.min(190,W/3.3));ch=cw*.62;tracks=(H>=W*.9||H>=430)?2:1;
    fld.querySelectorAll('.ln').forEach(e=>e.remove());for(let t=0;t<tracks;t++){const e=document.createElement('div');e.className='ln train';e.style.cssText=`top:${ty(t)+ch*.7}px;height:${ch*.3}px`;fld.insertBefore(e,fld.firstChild)}};
  const ty=t=>(H-tracks*ch)/(tracks+1)*(t+1)+t*ch;
  mk();window.onresize=mk;
  const st=[{tr:null,wait:.3,dir:1},{tr:null,wait:1.6,dir:-1}];const CC=['#42a5f5','#66bb6a','#ffa726','#ab47bc','#ec407a','#26c6da'];
  function spawnTrain(s,ti){const n=4,dir=s.dir;const k=1;const pos=shuffle([...Array(n).keys()]).slice(0,k);const cars=[];
    const mkEl=(html,cls)=>{const el=document.createElement('div');el.className='it sd '+(cls||'');el.style.cssText=`width:${cw}px;height:${ch}px`;el.innerHTML=html;fld.appendChild(el);return el};
    const loco=mkEl(`<div class="sv2 ${dir<0?'fl':''}">${svgLoco()}</div>`);
    for(let i=0;i<n;i++){const t=pos.includes(i),c=t?G.c:pickDis(G.c),font=one(FONTS);const el=mkEl(`<div class="sv2 ${dir<0?'fl':''}">${svgCar(CC[(i+ti*2)%CC.length])}</div>${lbHTML('car',c,ch,font)}`);
      const car={el,c,t,dead:false};cars.push(car);
      el.addEventListener('pointerdown',e=>{e.preventDefault();if(car.dead||!G.live)return;
        if(car.t){car.dead=true;el.querySelector('.lb').classList.add('pop');sfx('hit');hit(el)}else{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),420);miss(el,car.c)}})}
    s.tr={loco,cars,n,dir,tx:dir>0?-cw*1.05:W+cw*.05}}
  loop(dt=>{if(!G||!G.live)return;G.idle+=dt;
    const v=(W+cw*6)/(TT()*1.2);
    st.slice(0,tracks).forEach((s,ti)=>{
      if(!s.tr){s.wait-=dt;if(s.wait<=0)spawnTrain(s,ti);return}
      const T=s.tr;T.tx+=T.dir*v*dt;const y=ty(ti);
      T.loco.style.transform=`translate(${T.tx}px,${y}px)`;
      T.cars.forEach((c,i)=>{const x=T.tx+(T.dir>0?-(i+1):(i+1))*cw*1.02;c.el.style.transform=`translate(${x}px,${y}px)`;c.el.classList.toggle('glow',c.t&&!c.dead&&G.idle>8)});
      const out=T.dir>0?(T.tx-(T.n)*cw*1.02>W):(T.tx+(T.n+1)*cw*1.02<0);
      if(out){T.loco.remove();T.cars.forEach(c=>c.el.remove());s.tr=null;s.dir=-s.dir;s.wait=.6+Math.random()*.8}})})}

/* ===== 注音遊戲 ===== */
const ZG=[[...'ㄅㄆㄇㄈ'],[...'ㄉㄊㄋㄌ'],[...'ㄍㄎㄏ'],[...'ㄐㄑㄒ'],[...'ㄓㄔㄕㄖ'],[...'ㄗㄘㄙ'],[...'ㄧㄨㄩ'],[...'ㄚㄛㄜㄝㄦ'],[...'ㄞㄟㄠㄡ'],[...'ㄢㄣㄤㄥ'],[...'ˊˇˋ˙']];
const zyOf=c=>[...((G&&G.word)||c)];
const ZSAY={ㄅ:'波',ㄆ:'坡',ㄇ:'摸',ㄈ:'佛',ㄉ:'德',ㄊ:'特',ㄋ:'訥',ㄌ:'勒',ㄍ:'歌',ㄎ:'科',ㄏ:'喝',ㄐ:'雞',ㄑ:'七',ㄒ:'吸',ㄓ:'知',ㄔ:'吃',ㄕ:'詩',ㄖ:'日',ㄗ:'資',ㄘ:'雌',ㄙ:'絲',ㄧ:'一',ㄨ:'烏',ㄩ:'魚',ㄚ:'啊',ㄛ:'喔',ㄜ:'鵝',ㄝ:'耶',ㄞ:'哀',ㄟ:'欸',ㄠ:'熬',ㄡ:'歐',ㄢ:'安',ㄣ:'恩',ㄤ:'骯',ㄥ:'鞥',ㄦ:'兒','ˊ':'第二聲','ˇ':'第三聲','ˋ':'第四聲','˙':'輕聲'};
const ZALL=[...'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ'];
function zyTiles(tg,low){const cs=x=>low?x.toLowerCase():x.toUpperCase();const out=[...tg],set=new Set(tg);for(const s of tg){const o=shuffle([...((low?CONFL[s]:CONF[s.toUpperCase()])||'')].map(cs).filter(x=>!set.has(x)));if(o.length){out.push(o[0]);set.add(o[0])}}
  const want=Math.min(9,Math.max(6,tg.length+3));let g=0;while(out.length<want&&g++<60){const x=cs(String.fromCharCode(65+rnd(26)));if(!set.has(x)){out.push(x);set.add(x)}}return shuffle(out)}
function playZy(){const fld=$('#fld');let tg=zyOf(G.c);const N=tg.length;let round=0,k=0,tiles=[];
  fld.insertAdjacentHTML('beforeend','<div class="zyw"><div class="zyq"></div><div class="zys"></div><div class="zyt"></div></div>');
  const q=fld.querySelector('.zyq'),sl=fld.querySelector('.zys'),tl=fld.querySelector('.zyt');
  const fs=n=>{const W=fld.clientWidth-16,H=fld.clientHeight-16,rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;let f=Math.min(96,W/5.2,H/6.2);const fit=f=>{const cell=f*1.25+rem*.6,cols=Math.max(1,Math.floor((W+rem*.6)/cell)),rows=Math.ceil(n/cols);return rem*2.4+f*1.25+rem*.8+rows*cell<=H&&cols>=1};let g=0;while(!fit(f)&&f>28&&g++<60)f*=.94;return f};
  function build(){k=0;const low=round===0;const wd=low?G.word.toLowerCase():G.word;tg=[...wd];const bt=document.querySelector('#ban .tg span');if(bt)bt.textContent=wd;if(round===1)say(`${rep3(G.word)}，拚出這個字的大寫字`);q.innerHTML=`第 ${round+1} 次，拼出 ${wd}，${low?'先小寫':'再大寫'}，一個字母一個字母點`;const sy=zyTiles(tg,low),f=fs(sy.length);
    const sw=Math.min(f*1.15,(fld.clientWidth-20-(N-1)*10)/N);sl.innerHTML=tg.map((s,i)=>`<div class="zsl" style="width:${sw}px;height:${sw*1.1}px;font-size:${sw*.75}px"></div>`).join('');
    tl.innerHTML='';tiles=sy.map(s=>{const el=document.createElement('button');el.className='zt';el.style.cssText=`width:${f*1.25}px;height:${f*1.25}px;font-size:${f*.8}px`;el.textContent=s;tl.appendChild(el);
      el.addEventListener('pointerdown',e=>{e.preventDefault();if(!G.live||el.classList.contains('used'))return;tap(el,s)});return {el,s}});mark()}
  function mark(){[...sl.children].forEach((e,i)=>e.classList.toggle('nx',i===k));tiles.forEach(t=>t.el.classList.remove('glow'))}
  function tap(el,s){if(s===tg[k]){el.classList.add('used');const slot=sl.children[k];slot.textContent=s;slot.classList.add('ok');slot.classList.remove('nx');k++;hit(el);
      if(k>=N){say(G.word,{verse:true})}if(k>=N&&G.hits<G.goal){round++;later(()=>{if(G.live)build()},1200)}else mark()}
    else{G.wrong++;sfx('bad');el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),420);const m=$('#msg');m.innerHTML=`這是「${s}」，我們先找「${tg[k]}」`;m.classList.add('on');later(()=>m.classList.remove('on'),1700)}}
  window.onresize=()=>{if(G.live&&k===0)build()};
  build();
  loop(dt=>{if(!G||!G.live)return;G.idle+=dt;if(G.idle>7){const t=tiles.find(t=>t.s===tg[k]&&!t.el.classList.contains('used'));if(t)t.el.classList.add('glow')}})}
