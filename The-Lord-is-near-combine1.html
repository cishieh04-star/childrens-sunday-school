<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>主近了（The Lord is near）</title>
<style>
:root{--ink:#4a2a1a;--ink2:#7a5a4a;--bg:#fff6ee;--p:var(--p);--p2:var(--p2);--pl:var(--pl);--mint:#5fd0b8;--mint2:#2fa58c;--lemon:#ffd54d;--lemon2:#e0a800;--choc:#8a5434;--choc2:#5e3420;--sky:#7cc8ff;--sky2:#3a96e0;--grape:#a98af0;--grape2:#7a5ad0;--shadow:0 .3rem 0 rgba(0,0,0,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--pl);user-select:none;-webkit-user-select:none;touch-action:manipulation;font-size:1.06rem}
.en{font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold",Arial,sans-serif;letter-spacing:.02em}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
ruby{ruby-align:center}rt{font-size:.42em;color:#c4401f;font-weight:700;letter-spacing:0}
.nozy rt{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);box-shadow:0 0 30px rgba(0,0,0,.12)}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
/* buttons */
.btn{border:none;border-radius:1rem;padding:.7rem 1.1rem;font-size:1.05rem;font-weight:900;box-shadow:0 .3rem 0 var(--b2,#ccc);background:var(--b1,#fff);color:var(--bt,var(--ink));transition:transform .06s}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 var(--b2,#ccc)}
.btn.big{font-size:1.2rem;padding:.85rem 1.3rem}
.btn.sm{font-size:.9rem;padding:.45rem .8rem}
.btn.w{--b1:#fff;--b2:#e0cfc4}.btn.g{--b1:var(--mint);--b2:var(--mint2);--bt:#fff}.btn.p{--b1:var(--p);--b2:var(--p2);--bt:#fff}
.btn.y{--b1:var(--lemon);--b2:var(--lemon2)}.btn.b{--b1:var(--sky);--b2:var(--sky2);--bt:#fff}.btn.v{--b1:var(--grape);--b2:var(--grape2);--bt:#fff}.btn.c{--b1:var(--choc);--b2:var(--choc2);--bt:#fff}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row.c{justify-content:center}
.ibtn{border:none;background:#fff;border-radius:50%;width:2.4rem;height:2.4rem;font-size:1.15rem;box-shadow:0 .2rem 0 #e0cfc4;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
/* hud */
.hud{flex:none;background:linear-gradient(var(--h1),var(--p));color:#fff;padding:.45rem .6rem;padding-top:calc(.45rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.45rem;box-shadow:0 .25rem 0 var(--p2);z-index:3}
.hud .ttl{flex:1;font-weight:900;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.hud .back{border:none;background:#fff;border-radius:.8rem;width:2.5rem;height:2.4rem;font-size:1.15rem;box-shadow:0 .2rem 0 var(--p2);flex:none}
.chip{background:#fff;color:var(--ink);border-radius:99px;padding:.22rem .6rem;font-weight:900;font-size:.85rem;box-shadow:0 .15rem 0 rgba(0,0,0,.12);white-space:nowrap;flex:none}
.zybtn{border:none;background:var(--lemon);border-radius:.7rem;padding:.2rem .45rem;font-weight:900;font-size:.85rem;line-height:1.05;box-shadow:0 .2rem 0 var(--lemon2);flex:none}
.zybtn small{display:block;font-size:.65rem}
.zybtn.off{background:#fff;opacity:.85}
.hud2{flex:none;display:flex;gap:.4rem;align-items:center;padding:.4rem .6rem;background:var(--pl2);border-bottom:.15rem solid var(--pl3)}
.prog{flex:1;height:.7rem;background:var(--pl2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--lemon));border-radius:99px;transition:width .4s}
/* title */
.title{background:var(--titlebg)}
.logo{text-align:center;margin-top:.6rem}
.logo .house{font-size:4rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
.logo h1{margin:.2rem 0 0;font-size:2.3rem;color:var(--p2);text-shadow:0 .15rem 0 #fff,0 .3rem 0 rgba(0,0,0,.12);letter-spacing:.08em}
.logo .vs{display:inline-block;margin-top:.5rem;background:#fff;border-radius:1rem;padding:.4rem .9rem;font-weight:900;color:var(--p2);box-shadow:0 .2rem 0 var(--pl3);font-size:1.25rem}
.logo .vs small{display:block;color:var(--ink2);font-size:.8rem}
.card{background:#fff;border-radius:1.3rem;padding:1rem;box-shadow:0 .3rem 0 var(--sh);margin:.8rem 0}
.kids{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.kid{border:.18rem solid var(--pl3);background:var(--pl2);border-radius:1rem;padding:.4rem .5rem;min-width:5.4rem;text-align:center;font-weight:900}
.kid.on{border-color:var(--p);background:var(--pl2);box-shadow:0 0 0 .15rem var(--pl3)}
.kid .av{font-size:1.8rem}.kid .nm{font-size:.95rem}.kid .pt{font-size:.72rem;color:var(--ink2)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.avs button{border:.15rem solid transparent;background:var(--pl2);border-radius:.8rem;font-size:1.5rem;padding:.2rem 0}
.avs button.on{border-color:var(--p);background:var(--pl2)}
.inp{width:100%;border:.15rem solid var(--pl3);border-radius:.9rem;padding:.6rem .8rem;font-size:1.1rem;font-family:inherit;text-align:center;background:var(--pl2)}
.lbl{text-align:center;font-weight:900;color:var(--ink2);font-size:.9rem;margin:.6rem 0 .35rem}
/* map */
.map{position:relative;height:1180px;background:var(--mapbg);border-radius:1.2rem;overflow:hidden;margin-top:.4rem}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:none;background:none;padding:0;width:8rem}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--nc) 70%);border:.25rem solid #fff;box-shadow:0 .35rem 0 rgba(0,0,0,.18);font-size:2.2rem;display:flex;align-items:center;justify-content:center}
.node.next .orb{animation:pulse 1.4s infinite}
.node .nm{margin-top:.25rem;background:#fff;border-radius:99px;padding:.15rem .6rem;font-weight:900;font-size:.88rem;box-shadow:0 .15rem 0 rgba(0,0,0,.1);white-space:nowrap}
.node .st{font-size:.85rem;letter-spacing:-.1em;margin-top:.1rem}
.deco{position:absolute;font-size:1.8rem;pointer-events:none;opacity:.9}
.dock{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;padding:.55rem .6rem calc(.55rem + env(safe-area-inset-bottom));background:var(--dock);border-top:.3rem solid var(--pl)}
.dock .btn{font-size:.92rem;padding:.6rem .3rem}
/* stage common */
.inst{display:flex;align-items:center;gap:.5rem;background:#fff;border-radius:1rem;padding:.55rem .7rem;box-shadow:0 .2rem 0 var(--sh);font-weight:900;margin-bottom:.7rem}
.inst .em{font-size:1.5rem}.inst .tx{flex:1}
.qcard{background:#fff;border-radius:1.2rem;padding:.9rem;box-shadow:0 .3rem 0 var(--sh);text-align:center;margin-bottom:.8rem;position:relative}
.qcard .pic{font-size:3.4rem;line-height:1.1}
.qcard .zh{font-size:1.15rem;font-weight:900;color:var(--ink2)}
.qcard .stem{font-size:1.2rem;font-weight:900;line-height:1.7}
.qcard .ibtn{position:absolute;right:.5rem;top:.5rem}
.word{font-size:2.6rem;font-weight:900;color:var(--p2);letter-spacing:.06em}
.blank{display:inline-block;min-width:1.2em;border-bottom:.2rem dashed var(--p);color:var(--p)}
.opts{display:grid;gap:.6rem}
.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:repeat(2,1fr)}.opts.c1{grid-template-columns:1fr}
.opt{border:none;border-radius:1.1rem;padding:.8rem .5rem;font-size:1.15rem;font-weight:900;background:var(--oc,#fff);box-shadow:0 .3rem 0 rgba(0,0,0,.15);min-height:3.6rem;display:flex;align-items:center;justify-content:center;gap:.4rem;text-align:center;line-height:1.4}
.opt .k{background:rgba(255,255,255,.75);border-radius:.5rem;padding:0 .35rem;font-size:.8rem}
.opt.big{font-size:2rem;min-height:4.6rem}
.opt.ok{background:#b8f0c8!important;box-shadow:0 0 0 .2rem var(--mint2),0 .3rem 0 var(--mint2)}
.opt.no{background:#eee!important;opacity:.5;animation:shake .35s}
.opt.hint{animation:pulse 1s infinite}
.c0{--oc:var(--pl2)}.c1{--oc:#d8f0ff}.c2{--oc:#fff1b8}.c3{--oc:#dff7e8}.c4{--oc:#efe4ff}.c5{--oc:#ffe6d2}
.fb{position:fixed;left:0;right:0;bottom:calc(.6rem + env(safe-area-inset-bottom));margin:0 auto;width:min(530px,calc(100vw - 1.2rem));z-index:30;box-shadow:0 .4rem 1.4rem rgba(0,0,0,.25);background:#fffbe8;border:.18rem solid #ffe08a;border-radius:1.1rem;padding:.8rem;text-align:center;animation:pop .3s}
.fb .ans{font-size:1.3rem;font-weight:900;color:var(--mint2);margin-bottom:.3rem}
.fb .why{font-weight:700;line-height:1.7}
.fb .row{margin-top:.6rem;justify-content:center}
/* letters */
.ltiles{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.lt{border:none;width:3.4rem;height:3.6rem;border-radius:.9rem;font-size:1.9rem;font-weight:900;background:var(--oc,#fff);box-shadow:0 .3rem 0 rgba(0,0,0,.15)}
.lt.used{opacity:.25}
.lt.found{background:#b8f0c8;box-shadow:0 0 0 .18rem var(--mint2)}
.lt.no{animation:shake .35s;background:#eee}
.lt.sp{width:1.2rem;background:none;box-shadow:none}
.slots{display:flex;gap:.35rem;justify-content:center;margin:.7rem 0 1rem;flex-wrap:wrap}
.slot{width:3rem;height:3.4rem;border-radius:.8rem;border:.2rem dashed var(--pl3);background:#fff;font-size:1.8rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--p2)}
.slot.full{border-style:solid;border-color:var(--p);background:var(--pl2)}
.slot.cur{border-color:var(--lemon2);background:#fffbe0}
/* words tiles */
.wtiles{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.wt{border:none;border-radius:1rem;padding:.6rem .9rem;font-size:1.5rem;font-weight:900;background:var(--oc,#fff);box-shadow:0 .3rem 0 rgba(0,0,0,.15);min-width:3.5rem}
.wt.used{opacity:.25}.wt.bad{outline:.2rem dashed #ff5a5a}.wt.fixed{background:#b8f0c8}
.wslots{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;background:#fff;border-radius:1.2rem;padding:.8rem;margin-bottom:.8rem;min-height:4.4rem;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.06)}
.ws{min-width:3.6rem;height:3.2rem;border-radius:.8rem;border:.2rem dashed var(--pl3);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;padding:0 .5rem;background:var(--pl2)}
.ws.full{border-style:solid;border-color:var(--p);background:var(--pl2)}
.ws.good{border-color:var(--mint2);background:#dff7e8}.ws.wrong{border-color:#ff5a5a;background:#ffe4e4}
/* tf */
.tfw{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tfb{border:none;border-radius:1.4rem;padding:1rem 0;font-size:2.6rem;background:#fff;box-shadow:0 .35rem 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;font-weight:900}
.tfb span{font-size:1.1rem}
.tfb.ok{background:#b8f0c8}.tfb.no{opacity:.4;animation:shake .35s}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.mcol{display:flex;flex-direction:column;gap:.6rem}
.mb{border:none;border-radius:1rem;min-height:3.8rem;font-size:1.35rem;font-weight:900;background:var(--oc,#fff);box-shadow:0 .3rem 0 rgba(0,0,0,.15);padding:.4rem}
.mb.sel{outline:.25rem solid var(--lemon2)}.mb.done{background:#b8f0c8;opacity:.75}.mb.no{animation:shake .35s}
/* story */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.book{border:none;border-radius:1.1rem;padding:.8rem .4rem;background:#fff;box-shadow:0 .3rem 0 var(--sh);display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:900}
.book .be{font-size:2.4rem}.book .bs{font-size:.75rem;color:var(--mint2)}
.book.rec{box-shadow:0 0 0 .2rem var(--lemon2),0 .3rem 0 var(--sh)}
.story{background:#fff;border-radius:1.2rem;padding:1rem;box-shadow:0 .3rem 0 var(--sh)}
.story h3{margin:.1rem 0 .6rem;text-align:center;color:var(--p2)}
.sline{display:flex;align-items:center;gap:.5rem;padding:.45rem 0;border-bottom:.1rem dashed var(--pl3)}
.sline .tx{flex:1}.sline .e1{font-size:1.25rem;font-weight:900}.sline .z1{color:var(--ink2);font-weight:700;font-size:.98rem}
/* verse */
.vbox{background:linear-gradient(#fff,var(--pl2));border-radius:1.4rem;padding:1rem .6rem;box-shadow:0 .35rem 0 var(--pl3);text-align:center}
.vref{display:inline-block;background:var(--p);color:#fff;border-radius:99px;padding:.15rem .8rem;font-weight:900;font-size:.9rem}
.vwords{display:flex;justify-content:center;gap:.5rem;margin:1rem 0 .6rem;flex-wrap:wrap}
.vw{border:none;border-radius:1.3rem 1.3rem 1rem 1rem;padding:.7rem .8rem .5rem;font-size:2rem;font-weight:900;background:var(--oc,var(--pl2));box-shadow:0 .35rem 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;min-width:5rem}
.vw small{font-size:1rem;color:var(--ink2)}
.vw.lit{background:#fff3a0;box-shadow:0 0 1rem rgba(255,200,60,.9),0 .35rem 0 rgba(0,0,0,.15);transform:scale(1.07)}
.vw.hid{color:transparent;background:repeating-linear-gradient(45deg,var(--pl3) 0 .5rem,var(--pl2) .5rem 1rem)}
.vw.hid small{color:transparent}
.vzh{font-size:1.5rem;font-weight:900;color:var(--choc)}
.lvls{display:flex;gap:.4rem;justify-content:center;margin:.6rem 0}
.lvl{border:.15rem solid var(--pl3);background:#fff;border-radius:.8rem;padding:.35rem .6rem;font-weight:900;font-size:.9rem}
.lvl.on{border-color:var(--p);background:var(--pl2)}
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.vbtns .btn{padding:.6rem .2rem;font-size:.95rem}
/* house */
.houseW{position:relative;height:260px;border-radius:1.3rem;overflow:hidden;background:var(--scene)}
.houseW svg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:280px;height:230px}
.sweets{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem;margin-top:.7rem}
.sweet{background:#fff;border-radius:.8rem;font-size:1.6rem;text-align:center;padding:.25rem 0;box-shadow:0 .15rem 0 var(--sh);animation:pop .4s}
.sweet.lock{opacity:.25;filter:grayscale(1)}
.bar{height:.9rem;background:var(--pl2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--lemon))}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .3rem;text-align:center;box-shadow:0 .2rem 0 var(--sh);font-weight:900;font-size:.85rem}
.badge .be{font-size:2.1rem}.badge.lock{opacity:.35;filter:grayscale(1)}
/* race */
.lanes{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem}
.lane{position:relative;height:3rem;background:repeating-linear-gradient(90deg,#fff 0 1.4rem,var(--pl2) 1.4rem 2.8rem);border-radius:99px;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.08)}
.lane .rn{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:2rem;transition:left .6s}
.lane .tn{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);font-weight:900;font-size:.85rem;color:var(--ink2)}
.lane .fl{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);font-size:1.5rem}
.lane.turn{box-shadow:0 0 0 .22rem var(--lemon2)}
/* boss */
.bossw{background:linear-gradient(#5a3a6a,#8a5aa0);border-radius:1.3rem;padding:.8rem;color:#fff;text-align:center;margin-bottom:.8rem}
.bossw .bf{font-size:3.6rem;line-height:1.1}
.hp{height:.9rem;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin:.4rem 1rem}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5a5a,#ffb02e);transition:width .4s}
.hearts{font-size:1.2rem;letter-spacing:.1rem}
.bossw.hit .bf{animation:shake .4s}
/* modal toast */
.mbg{position:fixed;inset:0;background:rgba(60,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:1.4rem;padding:1.1rem;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;animation:pop .3s}
.modal h2{margin:.2rem 0 .6rem;color:var(--p2)}
#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(74,42,26,.9);color:#fff;padding:.6rem 1rem;border-radius:1rem;font-weight:900;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.popf{position:fixed;pointer-events:none;z-index:70;font-weight:900;font-size:1.3rem;color:var(--p2);text-shadow:0 0 .3rem #fff,0 0 .3rem #fff;animation:floatup 1s forwards}
.conf{position:fixed;top:-2rem;font-size:1.6rem;z-index:80;pointer-events:none;animation:fall 1.8s linear forwards}
.stars{font-size:2.6rem;letter-spacing:.2rem}
.hint2{color:var(--ink2);font-weight:700;font-size:.9rem;text-align:center;margin:.4rem 0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem 0;border-bottom:.1rem dashed var(--pl3);font-weight:900;text-align:left}
.seg{display:flex;gap:.3rem}.seg button{border:.15rem solid var(--pl3);background:#fff;border-radius:.7rem;padding:.3rem .6rem;font-weight:900}.seg button.on{border-color:var(--p);background:var(--pl2)}

/* 夾娃娃機 */
.clawm{position:relative;height:17rem;border-radius:1.4rem;background:radial-gradient(circle at 50% 120%,var(--pl) 0 40%,transparent 41%),linear-gradient(#e8f6ff,#fff 60%,var(--pl2));border:.45rem solid var(--p);box-shadow:0 .35rem 0 var(--p2),inset 0 0 0 .2rem #fff;overflow:hidden;margin-bottom:.4rem}
.clawm .lights{position:absolute;top:0;left:0;right:0;height:10px;display:flex;justify-content:space-around;z-index:3}
.clawm .lights i{width:8px;height:8px;border-radius:50%;background:#ffd54d;animation:blink 1s infinite}.clawm .lights i:nth-child(2n){animation-delay:.5s;background:#7cc8ff}
.clawm .rail{position:absolute;top:12px;left:8px;right:8px;height:10px;border-radius:5px;background:var(--p2);z-index:2}
.claw{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .45s ease-in-out;z-index:4;pointer-events:none}
.rope{width:4px;height:14px;background:repeating-linear-gradient(#8a94a8 0 4px,#c0c8d8 4px 8px);transition:height .42s ease-in-out}
.hook{position:relative;width:60px;height:44px}
.hook .arm{transition:transform .2s}.hook .arm.l{transform-origin:24px 10px}.hook .arm.r{transform-origin:36px 10px}
.hook.open .arm.l{transform:rotate(22deg)}.hook.open .arm.r{transform:rotate(-22deg)}
.held{position:absolute;left:1px;top:20px}
.ball{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;border:.2rem solid #fff;font-size:1.9rem;font-weight:900;background:radial-gradient(circle at 32% 28%,#fff 0 12%,var(--oc,var(--pl2)) 13% 70%,rgba(0,0,0,.08));box-shadow:0 .3rem 0 rgba(0,0,0,.18);padding:0;z-index:1}
.ball.inhand{position:relative;transform:none!important}
.ball.shake{animation:shake .4s}
.ball.hintb{box-shadow:0 0 0 .3rem #ffd54d,0 0 1rem #ffb02e;animation:pulse 1s infinite}
.chute{position:absolute;right:6px;top:30px;width:56px;height:46px;border-radius:.6rem;background:#fff3b0;border:.18rem dashed #e0a800;display:flex;align-items:center;justify-content:center;font-size:1.5rem;z-index:1}
.belt{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#8a5434 0 18px,#a8704a 18px 36px);animation:beltmv 1s linear infinite}
@keyframes beltmv{to{background-position:36px 0}}
@keyframes blink{50%{opacity:.25}}
.ghost{color:var(--pl3);font-weight:900}
.lt.lw{display:inline-flex;align-items:center;justify-content:center;transition:transform .2s}
.lt.lit{transform:scale(1.25);background:#fff3a0;box-shadow:0 0 1rem rgba(255,190,60,.9),0 .3rem 0 rgba(0,0,0,.15);color:var(--p2)}
.lt.all{background:var(--pl2);color:var(--p2)}
@keyframes bob{50%{transform:translateY(-.4rem)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes floatup{to{transform:translateY(-3rem);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:380px){.lt{width:3rem;height:3.3rem;font-size:1.7rem}.word{font-size:2.2rem}}

.dock .btn{font-size:.86rem;padding:.6rem .15rem}
.tbtn{border:none;background:#fff;border-radius:.7rem;padding:.25rem .5rem;font-weight:900;font-size:.8rem;box-shadow:0 .15rem 0 var(--pl3);flex:none;line-height:1.25;color:var(--ink)}
.tbtn.on{background:var(--lemon);box-shadow:0 .15rem 0 var(--lemon2)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.thb{border:.18rem solid #eee;background:#fff;border-radius:.9rem;padding:.35rem .2rem;font-weight:900;font-size:.88rem;display:flex;flex-direction:column;align-items:center}
.thb .te{font-size:1.7rem}.thb.on{border-color:var(--p);background:var(--pl2);box-shadow:0 0 0 .15rem var(--pl3)}
.thb i{display:block;width:70%;height:.4rem;border-radius:99px;margin-top:.2rem}
.thsel{display:inline-block;margin-top:.5rem}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem .6rem;background:var(--scene);border-radius:1.3rem;padding:.7rem .6rem .5rem}
.hole{position:relative;height:5.4rem;overflow:hidden}
.hole::after{content:'';position:absolute;left:2%;right:2%;bottom:0;height:1.5rem;border-radius:50%;background:radial-gradient(#3a2414 40%,#6b4a2a 78%);z-index:2;pointer-events:none}
.mole{position:absolute;left:10%;right:10%;bottom:.55rem;height:4.3rem;border:none;border-radius:50% 50% .9rem .9rem;background:var(--oc,#fff);box-shadow:0 0 0 .18rem #fff;font-size:2.4rem;padding:0;transform:translateY(118%);transition:transform .22s;z-index:1}
.mole.up{transform:none}.mole.no{animation:shake .35s;opacity:.55}.mole.hit{background:#b8f0c8}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.fc{position:relative;height:5.6rem;border:none;background:none;padding:0;perspective:600px}
.fc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.fc.open .in,.fc.done .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb2{position:absolute;inset:0;border-radius:.9rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 .25rem 0 rgba(0,0,0,.15)}
.fc .fa{background:linear-gradient(135deg,var(--p),var(--h1));color:#fff;font-size:2rem;border:.2rem solid #fff}
.fc .fb2{background:var(--oc,#fff);transform:rotateY(180deg);font-size:1.25rem;padding:.2rem}
.fc .fb2 .pe{font-size:2rem;line-height:1.1}.fc .fb2 small{font-size:.8rem}
.fc.done .fb2{background:#b8f0c8}
.tank{position:relative;height:15rem;border-radius:1.4rem;overflow:hidden;background:linear-gradient(#d4f2ff,#8fd4f5 60%,#5ab8e6);box-shadow:inset 0 0 0 .3rem #fff,0 .3rem 0 var(--sh)}
.bub{position:absolute;left:0;top:0;border-radius:50%;border:none;padding:0;font-size:1.8rem;font-weight:900;color:var(--ink);background:radial-gradient(circle at 30% 28%,#fff 0 14%,rgba(255,255,255,.6) 15% 45%,rgba(255,255,255,.3) 70%,rgba(255,255,255,.7));box-shadow:inset 0 0 0 .15rem rgba(255,255,255,.95)}
.bub.popd{animation:popb .3s forwards}.bub.shake{animation:shake .4s}.bub.hintb{box-shadow:0 0 0 .3rem #ffd54d,0 0 1rem #ffb02e}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.sky2{position:relative;height:15rem;border-radius:1.4rem;overflow:hidden;background:var(--scene);box-shadow:0 .3rem 0 var(--sh)}
.fall{position:absolute;left:0;top:-70px;width:58px;height:58px;border:none;border-radius:1rem;font-size:2rem;font-weight:900;background:var(--oc,#fff);box-shadow:0 .25rem 0 rgba(0,0,0,.18);padding:0;z-index:2}
.fall.no{animation:shake .4s;opacity:.55}.fall.hintb{box-shadow:0 0 0 .3rem #ffd54d,0 0 1rem #ffb02e}
.basket{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:2.8rem;transition:left .35s;z-index:3;pointer-events:none}
.spin{display:inline-block;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hbig{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:6.5rem;line-height:1}

html{font-size:clamp(12.5px,calc(1.4vh + 5.5px),17px)}
.fb.inl{position:static;width:auto;box-shadow:none;margin-top:.8rem}
.scr{transform-origin:top center}

.vlist{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.vopt{border:.15rem solid #e6e6e6;background:#fff;border-radius:.7rem;padding:.3rem .55rem;font-weight:900;font-size:.88rem}
.vopt.on{border-color:var(--p);background:var(--pl2);box-shadow:0 0 0 .15rem var(--pl3)}

function sfx(k){try{const B=beep;
  if(k==='ok'){B(988,.08,'square',.05);B(1319,.28,'square',.05,.08)}                       /* 金幣 */
  else if(k==='bad'){B(740,.09,'square',.045);B(622,.14,'square',.045,.1)}                 /* 嘟嘟 */
  else if(k==='pop'||k==='blip')B(1568,.05,'square',.035);                                  /* 嗶 */
  else if(k==='win'){[1047,1319,1568,2093].forEach((f,i)=>B(f,.13,'square',.045,i*.09));B(2637,.35,'square',.04,.38)} /* 過關 */
  else if(k==='grab'){B(1760,.05,'square',.05);B(2349,.09,'square',.05,.06)}               /* 夾住 */
  else if(k==='motor'){for(let i=0;i<6;i++)B(i%2?1175:1047,.04,'square',.025,i*.07)}       /* 馬達 */
  else if(k==='down')B(1568,.32,'sine',.05,0,880);                                          /* 下降 */
  else if(k==='up')B(880,.32,'sine',.05,0,1760);                                            /* 上升 */
  else if(k==='fly'){B(1319,.06,'square',.04);B(1760,.06,'square',.04,.06);B(2349,.1,'square',.04,.12)}
  else if(k==='boing')B(1400,.25,'sine',.06,0,700);                                         /* 掉下去 */
  else if(k==='word'){[1319,1568,2093,1568,2093,2637].forEach((f,i)=>B(f,.1,'square',.045,i*.08))} /* 拼好了 */

function teamSetup(){let n=2;const m=modal(`<h2>🏆 ${T('小組競賽')}</h2><p>${T('幾個小組一起比賽？輪流答題，答對就往前跑一格，先跑到終點的小組贏！')}</p><div class="row c" id="tn">${[2,3,4].map(i=>`<button class="btn ${i===2?'p':'w'}" data-n="${i}">${i} ${T('組')}</button>`).join('')}</div><div class="row c" style="margin-top:.8rem"><button class="btn w" id="no">${T('返回')}</button><button class="btn g big" id="yes">▶ ${T('開始比賽')}</button></div>`);
  say('小組競賽。選幾個小組一起比賽，輪流答題，答對就往前跑，先跑到終點的小組贏！');
  $$('#tn .btn',m.el).forEach(b=>b.onclick=()=>{n=+b.dataset.n;$$('#tn .btn',m.el).forEach(x=>{x.classList.toggle('p',x===b);x.classList.toggle('w',x!==b)});sfx('pop')});
  $('#no',m.el).onclick=()=>{stopSay();m.close()};$('#yes',m.el).onclick=()=>{m.close();K().team++;saveDB();checkBadges();team(n)}}
function team(n){const GOAL=6;const sc=Array(n).fill(0);let turn=0;go(hud({title:'🏆 小組競賽',back:1})+`<div class="body" id="sb"></div>`);bindHud(hub);const sb=$('#sb');
  const lanes=()=>`<div class="lanes">${sc.map((v,i)=>`<div class="lane ${i===turn?'turn':''}"><span class="tn">${T(TH().teams[i][1])}</span><span class="rn" style="left:${32+v/GOAL*56}%">${TH().teams[i][0]}</span><span class="fl">🏁</span></div>`).join('')}</div>`;
  const next=()=>{const w=sc.findIndex(v=>v>=GOAL);if(w>=0){confetti(30);sfx('win');sb.innerHTML=lanes()+`<div class="card" style="text-align:center"><div style="font-size:3rem">${TH().teams[w][0]}🏆</div><h2>${T(TH().teams[w][1]+'贏了！')}</h2><p>${T('大家都好棒！')}</p><div class="row c"><button class="btn w big" id="tMap">🗺️ ${T('回地圖')}</button><button class="btn g big" id="tAgain">🔁 ${T('再比一次')}</button></div></div>`;$('#tMap').onclick=hub;$('#tAgain').onclick=()=>team(n);say(TH().teams[w][1]+'贏了！大家都好棒！');window.CUR={end:1};return}
    const q=bossQ();q.inst=lanes()+`<div class="inst"><span class="em">${TH().teams[turn][0]}</span><span class="tx">${T('輪到'+TH().teams[turn][1]+'答題')}</span></div>`;q.say=`輪到${TH().teams[turn][1]}。`+q.say;q.key=null;
    let ok1=true;q.onBad=()=>{ok1=false};q.onOk=()=>{if(ok1)sc[turn]++;};
    mcTeam(sb,q,()=>{turn=(turn+1)%n;next()})};next()}
function mcTeam(sb,q,done){/* 小組競賽：答錯就換下一組，不給個人糖果 */let locked=false;const ord=shuffle(q.opts.map((o,i)=>i));const L='ABCD';
  sb.innerHTML=q.inst+`<div class="qcard">${q.stem?`<div class="stem">${q.stem}</div>`:''}${spk(q.say)}</div><div class="opts c${q.cols||1}">${ord.map((i,k)=>`<button class="opt c${k} ${q.big?'big':''}" data-i="${i}">${q.opts[i].h}</button>`).join('')}</div>`;
  autoSay(q.say);const bs=$$('.opt',sb);window.CUR={tap:()=>bs.find(b=>+b.dataset.i===q.ans).click()};
  bs.forEach(b=>b.onclick=()=>{if(locked)return;locked=true;getAC();const i=+b.dataset.i;bs.forEach(x=>x.disabled=true);bs.find(x=>+x.dataset.i===q.ans).classList.add('ok');
    if(i===q.ans){sfx('ok');q.onOk()}else{b.classList.add('no');sfx('bad');q.onBad()}
    feedback(sb,`<div class="ans">${i===q.ans?'⭕ '+T('答對了！往前跑一格！'):'❌ '+T('沒關係，換下一組。')}</div><div class="why">${q.why}</div>`,(i===q.ans?'答對了！':'沒關係，換下一組。')+q.whySay,done)})}

/* ====== 設定 ====== */
function settings(){const s=DB.set;const seg=(k,arr)=>`<div class="seg" data-k="${k}">${arr.map(([v,t])=>`<button data-v="${v}" class="${String(s[k])===String(v)?'on':''}">${T(t)}</button>`).join('')}</div>`;
  go(hud({title:'⚙️ 設定',back:1})+`<div class="body"><div class="card">
   <div class="setrow"><span>${T('介面')}</span><button class="btn w sm" id="thS">🎨 ${TH().ic} ${T(TH().n)}</button></div><div class="setrow"><span>${T('聲音')}</span><button class="btn w sm" id="vcS">🔊 ${T('聲音不好聽？換聲音')}</button></div><div class="setrow"><span>${T('自動唸題目')}</span>${seg('auto',[[1,'開'],[0,'關']])}</div><div class="setrow"><span>${T('說話速度')}</span>${seg('rate',[['n','正常'],['s','慢一點']])}</div>
   <div class="setrow"><span>${T('注音')}</span>${seg('zy',[[1,'顯示'],[0,'不顯示']])}</div><div class="setrow"><span>${T('每關題數')}</span>${seg('len',[['s','短（6題）'],['l','標準（8題）']])}</div>
   <div class="setrow" style="display:block"><div>${T('字母 a 的唸法')}</div><small style="color:var(--ink2);display:block;margin:.2rem 0 .4rem">${T('點一下會試唸 happy 和 cake，選聽起來最對的一個。')}</small>${seg('aSay',[['en','英文 A'],['zh','中文「欸」'],['zhA','中文 A']])}</div>
   <div class="row c" style="margin-top:.8rem"><button class="btn b sm" id="vt">🔊 ${T('試聽')}</button><button class="btn r sm p" id="reset">🗑️ ${T('清除這位小朋友的進度')}</button></div></div>
   <div class="hint2">${T('如果聽不到聲音：請確認手機沒有靜音，或改用 Chrome／Safari 開啟。')}</div></div>`);bindHud();
  $$('.seg').forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{const k=g.dataset.k,v=b.dataset.v;s[k]=/^[01]$/.test(v)?+v:v;saveDB();$$('button',g).forEach(x=>x.classList.toggle('on',x===b));sfx('pop');if(k==='zy')$('.scr').classList.toggle('nozy',!s.zy);if(k==='aSay'){getAC();say(`${spell('happy')}。happy。${spell('cake')}。cake。`)}}));
  $('#vcS').onclick=()=>{getAC();voiceModal()};$('#thS').onclick=()=>{getAC();themePick(settings)};$('#vt').onclick=()=>{getAC();say(VERSE.en+' '+VERSE.zh)};
  $('#reset').onclick=()=>{const m=modal(`<h2>${T('確定要清除嗎？')}</h2><p>${T(K().nm+' 的糖果、星星和徽章都會清掉。')}</p><div class="row c"><button class="btn w" id="no">${T('不要')}</button><button class="btn p" id="yes">${T('清除')}</button></div>`);
    $('#no',m.el).onclick=m.close;$('#yes',m.el).onclick=()=>{const k=K();DB.kids[k.nm]=newKid(k.nm,k.av);saveDB();m.close();toast('清除好了。');hub()}}}

/* 測試用 */
window.APP={launch,hub,verse,house,badges,notebook,team,settings,title,K,DB:()=>DB,cur:()=>window.CUR};
applyTheme();mkStages();title();
</script>
