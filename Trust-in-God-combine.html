:root{--ink:#333}
*{box-sizing:border-box}

#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:6vh 5vw;text-align:center;overflow-y:auto}
#menu .ttl{font-size:min(2.6rem,8vw);font-weight:900;color:#b8465e;line-height:1.2}

.cards{display:flex;flex-wrap:wrap;gap:1.6rem;justify-content:center;max-width:56rem}
.card{width:min(22rem,88vw);border:none;border-radius:1.6rem;padding:1.6rem 1.4rem;cursor:pointer;color:#fff;text-align:left;box-shadow:0 .5rem 0 rgba(0,0,0,.18);transition:transform .08s;font-family:inherit}
.card:active{transform:translateY(.3rem)}
.card.a{background:linear-gradient(160deg,#e59aa6,#b84a62)}
.card.b{background:linear-gradient(160deg,#edc46e,#d68b3c)}
.card .em{font-size:2.6rem}
.card .t{font-size:1.5rem;font-weight:900;margin-top:.3rem}
.card .d{font-size:1.05rem;margin-top:.4rem;opacity:.95;line-height:1.5}
#stage{position:fixed;inset:0;display:none;flex-direction:column}
#stage.on{display:flex}
#bar{flex:none;display:flex;align-items:center;padding:.3rem .6rem;padding-top:calc(.3rem + env(safe-area-inset-top));background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:5}

#barTitle{flex:1;text-align:center;font-weight:800;font-size:1rem;color:#555;padding-right:2.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage iframe{flex:1;width:100%;min-height:0;border:0;display:block}
@media (max-width:420px){#menu .ttl{font-size:1.8rem}.card{padding:1.2rem 1.1rem}.card .em{font-size:2.1rem}.card .t{font-size:1.25rem}.card .d{font-size:.95rem}}
</style></head><body>

function b64ToUtf8(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
const menu=document.getElementById('menu'),stage=document.getElementById('stage'),fr=document.getElementById('fr'),barTitle=document.getElementById('barTitle');
let audioCtx=null;
function unlockAudio(){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0)}}catch(e){}
  try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(' ');u.lang='zh-TW';u.volume=0;speechSynthesis.speak(u)}}catch(e){}
}
function openGame(b64,title){unlockAudio();menu.style.display='none';barTitle.textContent=title;stage.classList.add('on');fr.setAttribute('srcdoc',b64ToUtf8(b64))}
function toMenu(){try{fr.contentWindow.speechSynthesis.cancel()}catch(e){}try{speechSynthesis.cancel()}catch(e){}stage.classList.remove('on');fr.removeAttribute('srcdoc');fr.setAttribute('src','about:blank');menu.style.display=''}
document.getElementById('btnA').onclick=()=>openGame(A64,'經文拼拼樂・Trust in God');
document.getElementById('btnB').onclick=()=>openGame(B64,'英文福音短句拼拼樂・Trust in God');
document.getElementById('back').onclick=toMenu;
</script>
