<style>
:root{--ink:#333}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden}

.cards{display:flex;flex-wrap:wrap;gap:1.6rem;justify-content:center;max-width:56rem}
.card{width:min(22rem,88vw);border:none;border-radius:1.6rem;padding:1.6rem 1.4rem;cursor:pointer;color:#fff;text-align:left;box-shadow:0 .5rem 0 rgba(0,0,0,.18);transition:transform .08s;font-family:inherit}
.card:active{transform:translateY(.3rem)}
.card.a{background:linear-gradient(160deg,#f1a3b0,#c0435a)}
.card.b{background:linear-gradient(160deg,#f6c667,#d98a2b)}
.card .em{font-size:2.6rem}
.card .t{font-size:1.5rem;font-weight:900;margin-top:.3rem}
.card .d{font-size:1.05rem;margin-top:.4rem;opacity:.95;line-height:1.5}
#stage{position:fixed;inset:0;display:none;flex-direction:column}
#stage.on{display:flex}
#bar{flex:none;display:flex;align-items:center;padding:.3rem .6rem;padding-top:calc(.3rem + env(safe-area-inset-top));background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:5}
#back{min-width:2.8rem;height:2.6rem;border:.18rem solid #a9b8cc;background:#fff;border-radius:.9rem;font-size:1rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 .7rem;box-shadow:0 .2rem 0 #d0d0d0;font-family:inherit}
#barTitle{flex:1;text-align:center;font-weight:800;font-size:1rem;color:#555;padding-right:2.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage iframe{flex:1;width:100%;min-height:0;border:0;display:block}
@media (max-width:420px){#menu .ttl{font-size:1.5rem}.card{padding:1.2rem 1.1rem}.card .em{font-size:2.1rem}.card .t{font-size:1.25rem}.card .d{font-size:.95rem}}
</style></head><body>

const menu = document.getElementById('menu');
const stage = document.getElementById('stage');
const back = document.getElementById('back');
const fr = document.getElementById('fr');
const barTitle = document.getElementById('barTitle');

/* iPhone / iPad 聲音解鎖：必須在使用者點擊的當下執行 */
let audioCtx = null;
function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
    }
  }catch(e){}
  try{
    if ('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'zh-TW'; u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function openGame(html, title){
  unlockAudio();
  menu.style.display = 'none';
  barTitle.textContent = title;
  stage.classList.add('on');
  fr.setAttribute('srcdoc', html);
}
function toMenu(){
  try{ fr.contentWindow.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.cancel(); }catch(e){}
  stage.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnA').onclick = () => openGame(A_HTML, '經文拼拼樂');
document.getElementById('btnB').onclick = () => openGame(B_HTML, '語文趣挑戰');
back.onclick = toMenu;
</script>
