<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>耶穌誕生 The Story of the Birth of Jesus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* 介面：聖誕馬廄（暖木頭色＋小花草，沿用 3-4 的介面）。
   版面：上方工具列＋一個不必往下捲的舞台，手機直放、平板橫放都放得下。 */
:root{
  --bg:#f7ead2; --bg2:#ecd3a8; --wood:#a8693f; --wood2:#7b4527; --ink:#3a2414; --card:#fffaf0;
  --roof:#d9533c; --leaf:#5f9e46; --sky:#cfe9f4; --gold:#f2b632; --good:#2f9e5b; --blue:#2f6db5; --red:#e2513c;
  --en:"Andika","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  --zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);-webkit-user-select:none;user-select:none;touch-action:manipulation}
html.tracing,html.tracing body{touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.en{font-family:var(--en)}
#bgdeco{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 12% 88%,rgba(95,158,70,.18) 0 60px,transparent 61px),radial-gradient(circle at 92% 92%,rgba(95,158,70,.16) 0 80px,transparent 81px),
  repeating-linear-gradient(90deg,rgba(123,69,39,.05) 0 2px,transparent 2px 46px)}
#bgdeco span{position:absolute;font-size:28px;opacity:.5}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- 上方工具列（所有畫面共用） ---------- */
#bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--wood),var(--wood2));box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tb{font:800 15px/1 var(--zh);padding:9px 12px;border-radius:14px;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tb.back{background:var(--roof);color:#fff}
.tb.pause{background:var(--gold)}
.starPill{font:800 16px/1 var(--en);padding:8px 12px;border-radius:999px;background:var(--ink);color:#fff3d6}
.starPill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}

.screen{position:fixed;left:0;right:0;bottom:0;top:var(--barH,56px);z-index:2;display:flex;flex-direction:column;overflow:auto;
  padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.screen.full{top:0}

/* ---------- 木頭按鈕 ---------- */
.wb{font:900 clamp(18px,4.8vmin,26px)/1.1 var(--zh);padding:13px 22px;border-radius:22px;border:3px solid var(--ink);color:#fff;background:var(--wood);box-shadow:0 5px 0 var(--ink)}
.wb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.wb.green{background:var(--good)}.wb.red{background:var(--roof)}.wb.gold{background:var(--gold);color:var(--ink)}
.chip{font:800 15px/1 var(--zh);padding:9px 12px;border-radius:12px;border:2.5px solid var(--ink);background:var(--card)}
.chip.on{background:var(--ink);color:#fff3d6}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.lbl{font-weight:900;font-size:15px}

/* ---------- 封面 ---------- */
#cover{align-items:center;justify-content:center;text-align:center;gap:1.8vh;cursor:pointer;background:linear-gradient(var(--sky),var(--bg) 70%)}
#cover .house{width:min(48vw,30vh)}
.ttl{font:700 clamp(30px,8.5vmin,58px)/1.05 var(--en);color:var(--roof);text-shadow:3px 3px 0 var(--ink);margin:0}
.sub{font-weight:900;font-size:clamp(15px,4vmin,21px)}
.go{font-size:clamp(24px,7vmin,40px);padding:14px 40px;animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.lineTip{padding:8px 12px;border-radius:12px;background:#fff3c4;border:2px solid #6b4a00;font-weight:800;font-size:14px}

/* ---------- 首頁 ---------- */
#home{align-items:center;justify-content:center;gap:1.6vh;text-align:center}
.buddies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bd{font-size:clamp(30px,8vmin,44px);line-height:1;padding:6px 8px;border-radius:16px;border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);min-width:62px}
.bd small{display:block;font:800 12px/1.2 var(--zh);margin-top:2px}
.bd.sel{background:var(--gold);transform:scale(1.08)}
#nameIn{font:800 18px var(--zh);padding:10px 14px;border-radius:14px;border:3px solid var(--ink);width:min(80vw,320px);text-align:center;background:#fff;color:var(--ink)}

/* ---------- 闖關地圖：聖誕馬廄的 14 扇窗 ---------- */
#map{align-items:center}
.houseBox{position:relative;width:min(100%,920px);flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center}
.roof{width:100%;height:clamp(54px,11vh,90px);position:relative;flex:none}
.roof svg{width:100%;height:100%;display:block}
.facade{flex:1 1 auto;min-height:0;width:94%;background:var(--wood);border:4px solid var(--ink);border-top:0;border-radius:0 0 18px 18px;padding:10px;
  display:grid;grid-template-columns:repeat(var(--mc,2),1fr);gap:10px;align-content:stretch;grid-auto-rows:minmax(0,1fr);max-height:min(100%,560px);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 22px)}
.win{position:relative;border:4px solid var(--ink);border-radius:14px 14px 8px 8px;background:var(--sky);padding:6px 4px;display:flex;align-items:center;gap:6px;min-height:58px;box-shadow:inset 0 0 0 3px #fff8;text-align:left}
.win .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--roof);color:#fff;font:900 16px/30px var(--en);text-align:center;border:2px solid var(--ink)}
.win .ic{flex:none;font-size:clamp(22px,6vmin,46px);line-height:1}
.win .nm{font-weight:900;font-size:clamp(13px,3.5vmin,24px);line-height:1.15}
.win.done{background:#e8f6d9}
.win.done::after{content:"⭐ 過關";position:absolute;right:4px;top:-12px;background:var(--good);color:#fff;font:900 12px/1 var(--zh);padding:4px 6px;border-radius:8px;border:2px solid var(--ink)}
.win.next{background:#fff3b0;animation:glowW 1.1s ease-in-out infinite}
.win.next .me{position:absolute;right:-8px;top:-16px;font-size:24px;animation:hop .8s ease-in-out infinite}
@keyframes glowW{50%{box-shadow:0 0 0 6px var(--gold),inset 0 0 0 3px #fff8}}
@keyframes hop{50%{transform:translateY(-5px)}}
.facade.wide .win{flex-direction:column;justify-content:center;text-align:center;gap:3px;padding:6px 3px}
.facade.wide .win .num{width:26px;height:26px;line-height:26px;font-size:14px}
.mapFoot{flex:none;padding-top:10px}

/* ---------- 遊戲畫面 ---------- */
#game{gap:6px}
.head{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center}
#lvTitle{font-weight:900;font-size:clamp(16px,4.3vmin,21px)}
.dots{display:flex;gap:5px}.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.d{background:var(--good)}.dots i.c{background:var(--roof)}
.board{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{font:900 14px/1 var(--zh);padding:7px 10px;border-radius:12px;border:2.5px solid var(--ink);color:#222}
.team.now{transform:scale(1.12);box-shadow:0 0 0 4px var(--gold)}
#instr{flex:none;text-align:center;font-weight:900;font-size:clamp(15px,4vmin,19px);min-height:1.3em}
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
#prompt{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
#field{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.foot{flex:none;display:flex;justify-content:center;gap:8px}
.again{font:900 18px/1 var(--zh);padding:11px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}

/* 選項（木頭牌子） */
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;width:100%}
.opt{font:700 clamp(20px,5.6vmin,34px)/1.2 var(--en);background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--wood2);padding:10px 16px;min-width:84px;min-height:60px;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .2s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--wood2)}
.opt.col{flex-direction:column;gap:4px}
.opt.sent{font-size:clamp(18px,5vmin,28px)}
.opt.pic{padding:6px;width:clamp(96px,28vmin,170px)}
@media (orientation:portrait){.opt.pic{width:clamp(96px,30vw,190px)}}
.opt .zhs{font:800 clamp(13px,3.4vmin,16px)/1.2 var(--zh);color:var(--wood2)}
.no{opacity:.3!important;filter:grayscale(1);pointer-events:none}
.yes{background:var(--good)!important;color:#fff!important;transform:scale(1.07)}
.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--gold),0 6px 0 var(--wood2);transform:scale(1.06)}}
.reading{outline:5px solid var(--roof);outline-offset:3px;transform:scale(1.05)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.heard{font:700 clamp(24px,7vmin,40px)/1.2 var(--en);background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:6px 16px;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s,background .2s}
.heard.show{opacity:1;transform:scale(1)}
.heard.say{background:#fff3b0}
.peekBox{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.peek{font:700 clamp(24px,7vmin,40px)/1.2 var(--en);background:#fff3b0;border:3px dashed var(--ink);border-radius:14px;padding:3px 14px;letter-spacing:1px}
.peek.off{display:none}
.heardBox{display:flex;flex-direction:column;align-items:center;gap:6px}
.heard .q{display:none;letter-spacing:4px}
.heard.off .txt{display:none}
.heard.off .q{display:inline}
.tb.sm{font-size:14px;padding:5px 12px}
.listen{font-size:clamp(44px,12vmin,74px);width:clamp(80px,20vmin,116px);height:clamp(80px,20vmin,116px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:4px solid var(--ink);animation:breathe 1.6s infinite}
.clk{display:block;width:clamp(130px,36vmin,230px);height:auto}
.clk.sm{width:clamp(84px,24vmin,140px)}
.digi{font:700 clamp(22px,6vmin,34px)/1 var(--en);background:#222;color:#7fff7a;padding:6px 12px;border-radius:10px;border:3px solid var(--ink);letter-spacing:2px}
.speech{position:relative;font:700 clamp(19px,5.2vmin,30px)/1.25 var(--en);background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:8px 14px;max-width:min(86vw,520px)}
.speech.me{background:var(--gold)}
.talking{animation:talk .45s ease-in-out infinite alternate;box-shadow:0 0 0 5px var(--blue)}
@keyframes talk{to{transform:scale(1.05)}}
.zhLine{font-weight:900;font-size:clamp(15px,4vmin,20px);color:var(--wood2)}

/* 教學卡（小教室） */
.lesson{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.lcard{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--wood2);padding:12px 18px;max-width:min(94vw,560px);text-align:center;animation:lin .35s}
@keyframes lin{from{transform:translateY(14px) scale(.96);opacity:0}}
.lcard .big{font:700 clamp(34px,10vmin,62px)/1.1 var(--en);color:var(--roof)}
.lcard .zh{font-weight:900;font-size:clamp(18px,5vmin,28px)}
.lcard .tip{font-weight:800;font-size:clamp(15px,4vmin,19px);color:var(--wood2);line-height:1.5}
.lcard .pic{font-size:clamp(54px,15vmin,96px);line-height:1}
@media (orientation:landscape) and (max-height:540px){
 .lcard{display:grid;grid-template-columns:auto auto;align-items:center;justify-items:center;column-gap:16px;row-gap:4px;padding:8px 16px;max-width:96vw}
 .lcard>.clk,.lcard>.pic{grid-column:1;grid-row:1/span 6}
 .lcard>*{grid-column:2}
 .lcard .clk{width:min(38vh,160px)}
 .lcard .pic{font-size:min(16vh,70px)}
 .lcard .big{font-size:clamp(24px,8vh,40px)}
 .lcard .zh{font-size:clamp(15px,5vh,22px)}
 .lcard .tip{font-size:clamp(12px,3.8vh,16px);line-height:1.35}
 .lesson{gap:6px}
 .lesson>.zhLine{display:none}
 .lcard .numGrid{grid-template-columns:repeat(6,auto)}
 .clk.sm{width:clamp(60px,24vh,96px)}
 .bossTop>div:first-child{display:none}
 #field .cq{gap:6px}
 #prompt .bossTop{display:none}
 #prompt:has(.bossTop){display:none}
 #field .slot{width:clamp(26px,5.2vw,40px);height:clamp(32px,11vh,46px);font-size:clamp(18px,7vh,30px)}
 #field .tile{min-width:clamp(34px,10vh,50px);height:clamp(34px,10vh,50px);padding:0 5px;font-size:clamp(18px,6.5vh,28px)}
 #field .tiles{gap:6px;margin-top:8px}
 #prompt .sched{gap:4px}
 #prompt .sched div{padding:2px 5px;font-size:12px}
 #prompt .sched div .e{font-size:16px}
 #prompt .sched div b{font-size:14px}
 .opt.pic{width:clamp(70px,21vh,110px)}
 .cqP .heard{font-size:22px;padding:4px 10px}
 .listen{width:64px;height:64px;font-size:38px}
 .gears{font-size:16px}
 .bossTop .zhLine{display:none}
 .comic .who{font-size:36px}
 .comic .zhLine{font-size:14px}
 .foot{position:absolute;right:6px;bottom:2px;z-index:3}
 #stage{flex-direction:row;align-items:center;padding-right:118px;gap:10px}
 #prompt{flex:0 1 auto;flex-direction:column;max-width:42%;flex-wrap:nowrap}
 #prompt:empty{display:none}
 #field{flex:1 1 0;min-width:0;align-self:stretch}
 .opts{gap:8px}
 .lcard .clk{width:min(32vh,140px)}
}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tb[disabled]{opacity:.35}
.numGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.numGrid span{font:700 clamp(15px,4vmin,20px)/1.1 var(--en);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 6px}
.numGrid span b{display:block;font-size:1.3em;color:var(--blue)}
.numGrid span.on{background:var(--gold);transform:scale(1.08)}
.hlH{color:var(--blue)}.hlM{color:var(--red)}

/* 糖果罐 */
.candies{display:flex;gap:clamp(10px,4vw,30px);justify-content:center;flex-wrap:wrap}
.candy{width:clamp(86px,24vmin,140px);height:clamp(86px,24vmin,140px);border-radius:50%;border:4px solid var(--ink);font:700 clamp(32px,10vmin,56px)/1 var(--en);color:var(--ink);
  background:radial-gradient(circle at 32% 28%,#fff 0 10%,var(--c) 45%);box-shadow:0 6px 0 rgba(0,0,0,.2);animation:hop 2.2s ease-in-out infinite;animation-delay:var(--d)}
.jars{display:flex;gap:18px;justify-content:center;margin-top:14px}
.jar{width:clamp(110px,30vmin,170px);height:clamp(80px,20vmin,120px);border:4px solid var(--ink);border-top-width:8px;border-radius:14px 14px 30px 30px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;position:relative;overflow:hidden}
.jar b{font:700 clamp(18px,5vmin,26px)/1 var(--en);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px}
.jar.yes b{color:var(--ink)!important}
.jar .in{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:6px;font:700 13px var(--en)}
.jar .in i{font-style:normal;background:var(--gold);border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;border:2px solid var(--ink)}

/* 字卡／拼字 */
.slots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.slot{width:clamp(30px,8.5vw,52px);height:clamp(40px,10vw,60px);border:3px solid var(--ink);border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font:700 clamp(22px,6.5vw,38px)/1 var(--en)}
.slot.next{box-shadow:0 0 0 4px var(--roof);animation:breathe 1.2s infinite}
.slot.full{background:#e8f6d9}
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:12px}
.tile{min-width:clamp(52px,14vmin,74px);height:clamp(52px,14vmin,74px);padding:0 10px}
.wtile{font-size:clamp(20px,5.6vmin,30px);min-height:54px}
.sentRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:58px;align-items:center;padding:6px 10px;border:3px dashed var(--wood);border-radius:16px;background:#fff8;min-width:min(86vw,420px)}
.sentRow span{font:700 clamp(20px,5.6vmin,30px)/1 var(--en);background:#e8f6d9;border:3px solid var(--ink);border-radius:12px;padding:8px 10px}
.used{opacity:.25;pointer-events:none}

/* 魔法 e */
.magic{font:700 clamp(40px,12vmin,70px)/1 var(--en);display:flex;align-items:center;gap:6px}
.magic .e{color:var(--roof)}
.wand{display:inline-block;animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-20deg)}}

/* 漫畫對話 */
.comic{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%;max-width:640px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1}
.who{font-size:clamp(50px,14vmin,84px);line-height:1}
.sched{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sched div{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:4px 8px;text-align:center;font-weight:900;font-size:13px}
.sched div b{display:block;font:700 18px/1.1 var(--en)}
.sched div .e{font-size:24px;line-height:1.1}

/* 大魔王：跟著星星走 */
@media (max-height:760px){.bossTop>div:first-child{display:none!important}}
@media (orientation:portrait) and (max-height:760px){.bossTop .zhLine{display:none}#field .cq{gap:6px}#field .cq .opts{gap:8px}}
.cq{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.cqP{display:flex;flex-direction:column;align-items:center;gap:6px}
.bossTop{display:flex;align-items:center;justify-content:center;gap:12px}
.bossTop .clk{width:clamp(110px,26vmin,170px)}
.gears{font-size:22px;letter-spacing:2px}

/* 描字 */
.traceHost{position:relative;width:100%;flex:1 1 auto;min-height:260px}
.traceWrap{position:absolute;left:0;top:0;right:0;bottom:0}
.traceWrap canvas,.traceWrap .sov{position:absolute;left:0;top:0;width:100%;height:100%}
.traceWrap canvas.cv{touch-action:none}
.traceWrap .sov,.traceWrap canvas.gridcv{pointer-events:none}
.board2{position:absolute;left:4px;top:4px;right:4px;bottom:4px;border-radius:22px;background:#4f7d48;border:8px solid var(--wood);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.sov .sdemo{fill:none;stroke:#ffb020;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.sov .scur{fill:none;stroke:#ffb020;stroke-width:2.6;stroke-dasharray:3 3;stroke-linecap:round;animation:sdash .8s linear infinite}
@keyframes sdash{to{stroke-dashoffset:-6}}
.sov .sbadge{transition:opacity .3s}
.sov .sbadge.now{animation:bblink .9s ease-in-out infinite}
@keyframes bblink{50%{opacity:.35}}
.sov .sbadge.past circle{fill:#9aa7b4}

/* MIX_VOICE：中文句子裡的英文字，改用英文聲音唸（例如 Kevin、Boka、party、fifty），中文聲音唸英文常常會唸錯 */
(function(){var ss=window.speechSynthesis;if(!ss||ss.__mix)return;var orig=ss.speak.bind(ss);ss.__mix=1;
  var RX=/([A-Za-z][A-Za-z'’\-]*(?:[ ,.!?&]+[A-Za-z][A-Za-z'’\-]*)*[.!?]?)/;
  ss.speak=function(u){try{
    var t=String(u.text||''),lang=String(u.lang||'');
    if(!/^zh/i.test(lang)||!/[A-Za-z]{2,}/.test(t)||!/[㐀-鿿]/.test(t))return orig(u);
    var parts=t.split(RX).map(function(x){return x.trim()}).filter(function(x){return x&&!/^[，。、！？「」：；…（）\s,.!?]+$/.test(x)});
    if(parts.length<2)return orig(u);

      if(i===parts.length-1){p.onend=u.onend;p.onerror=u.onerror}else p.onerror=function(e){u.onerror&&u.onerror(e)};
      orig(p)});
  }catch(e){return orig(u)}};
})();

  let i=0,step=0,alive=true;$('#dots').innerHTML='';
  const finish=()=>{if(!alive)return;alive=false;G.onReplay=null;hush();then()};
  const go=()=>{if(!alive)return;if(i<list.length-1){i++;card()}else{alive=false;G.onReplay=null;say([{t:'開始玩囉！',zh:1}]);later(()=>{hush();then()},1300)}};
  const card=()=>{
    const c=list[i];$('#instr').textContent=head||'先認識這些英文';P().innerHTML='';
    F().innerHTML=`<div class="lesson"><div class="zhLine">${i+1} / ${list.length}</div><button class="lcard" id="lcard">${c.html}</button><div class="lnav"><button class="tb" id="lPrev" ${i?'':'disabled'}>上一個</button><button class="tb" id="lNext">下一個</button><button class="wb green" id="lGo" style="padding:9px 18px">開始玩</button></div></div>`;
    const items=typeof c.items==='function'?c.items():c.items;G.promptItems=items;
    const play=lead=>{const m=++step;say([...(lead||[]),...items],()=>later(()=>{if(m===step&&alive)go()},c.wait||900))};
    G.onReplay=()=>{hush();play()};
    play(i===0&&head!==null?[{t:head||'先認識這些英文',zh:1,gap:400}]:[]);
    $('#lcard').onclick=()=>{hush();play()};
    $('#lPrev').onclick=()=>{if(i){hush();i--;card()}};
    $('#lNext').onclick=()=>{hush();go()};
    $('#lGo').onclick=finish;
    c.after&&c.after();fitCheck()};
  card()}

/* 描一個單字：看圖聽單字 → 一個字母一個字母描 → 用自己描的字母排出整個單字 */
function traceWord(item,lead,onDone){
  const w=item.w,snaps=[];let k=0;
  P().innerHTML='';
  F().innerHTML=`<div class="lesson"><div class="lcard"><span class="pic en" style="color:var(--blue)">${item.n}</span><span class="big">${w}</span><span class="zh">${item.z}</span></div></div>`;
  $('#instr').textContent='看一看，聽一聽';
  G.promptItems=[{t:w,gap:600},{t:item.z,mean:1}];
  say([...(lead?[{t:lead,zh:1,gap:300}]:[]),{t:w,gap:600},{t:item.z,mean:1,gap:500},{t:w}],()=>later(nextLetter,700));
  function nextLetter(){
    if(k>=w.length){finishWord();return}
    const ch=w[k];
    $('#instr').textContent=k===0?'用手指，一個字母一個字母描':'描下一個字母';
    F().innerHTML='<div class="traceHost" id="th"></div>';
    const sumW=w.split('').reduce((a,c)=>a+lbox(c).w,0);
    const side=Gm=>{const top=Gm.mode==='top';
      const hp=top?Math.max(28,Math.min((Gm.TH-16)*.72,(Gm.w*.58-24)*92/sumW)):Math.max(28,Math.min(Gm.LW*.55,(Gm.LW-24)*92/sumW));
      return `<div class="tpic"${top?` style="font-size:${Math.round((Gm.TH-16)*.42)}px"`:''}>${item.n}</div><div class="tword">${w.split('').map((c,j)=>j<k&&snaps[j]?`<img src="${snaps[j]}" alt="${c}" style="height:${hp}px;width:${hp*lbox(c).w/92}px">`:letterSVG(c,j===k?'cur':'todo',hp)).join('')}</div><div class="tzh">${item.z}</div>`};
    G.promptItems=[{t:LN(ch)}];
    say([...(k===0?[{t:'用手指，一個字母一個字母描',zh:1,gap:300}]:[]),{t:LN(ch)}]);
    makeTrace($('#th'),ch,{side,sumW},s=>{snaps[k]=s;FX.ding();k++;later(nextLetter,350)});
  }
  function finishWord(){
    setTracing(false);
    $('#instr').textContent='你寫好了！';
    F().innerHTML=`<div class="lesson"><div class="zhLine">${item.n}　${item.z}</div><div class="wDone en" id="wd">${w.split('').map((c,j)=>`<span class="lt">${snaps[j]?`<img src="${snaps[j]}" alt="${c}">`:c}</span>`).join('')}</div></div>`;
    addStar();celebrate($('#wd'));
    const lts=$$('#wd .lt');
    const items=[...w.split('').map((c,j)=>({t:LN(c),gap:300,on:()=>lts[j].classList.add('say'),off:()=>lts[j].classList.remove('say')})),{t:w,gap:500},{t:item.z,mean:1}];
    G.promptItems=items;
    later(()=>say(items,()=>later(onDone,900)),900)}
}

/* 單字接龍：上一個字的最後一個字母，就是下一個字的第一個字母 */
const CHAIN=[['God','上帝'],['love','愛'],['loves','愛'],['world','世界'],['angel','天使'],['baby','小寶寶'],['son','兒子'],['dream','夢'],['trip','旅程'],['inn','客棧'],
  ['stable','馬廄'],['manger','馬槽'],['star','星星'],['sky','天空'],['shepherds','牧羊人'],['news','消息'],['gift','禮物'],['big','大的'],['long','長的'],['full','滿的'],
  ['good','好的'],['yes','是的'],['see','看'],['said','說'],['came','來'],['went','去'],['put','放'],['sent','派'],['born','出生'],['told','告訴'],['you','你'],['stayed','住'],['talked','說話']]
const CZ={};CHAIN.forEach(c=>CZ[c[0]]=c[1]);
const cpic=w=>PIC[w]?picSVG(w):PIC[w.toLowerCase()]?picSVG(w.toLowerCase()):w==='loves'?picSVG('love'):w==='told'||w==='talked'?picSVG('said'):w==='sent'?picSVG('angel'):w==='stayed'?picSVG('stable'):'';
const nextOf=w=>CHAIN.map(c=>c[0]).filter(x=>x!==w&&x[0].toLowerCase()===w[w.length-1].toLowerCase());
/* 找一條 5 個字的接龍 */
function makeChain(){/* 故事裡的字 */for(let t=0;t<200;t++){const path=[rnd(CHAIN)[0]];
  while(path.length<5){const n=nextOf(path[path.length-1]).filter(x=>!path.includes(x));if(!n.length)break;path.push(rnd(n))}
  if(path.length>=5)return path}return ['sky','yes','said','dream','manger']}
/* 片語：兩個字合在一起（故事裡的片語） */
const PHR=[['good','news','好消息'],['big','star','大星星'],['baby','Jesus','小寶寶耶穌'],['long','trip','很遠的路'],["God's",'Son','上帝的兒子'],["God's",'gift','上帝的禮物'],
  ['took','care','照顧'],['in a','dream','在夢裡'],['in a','manger','在馬槽裡'],['in a','stable','在馬廄裡'],['in the','sky','在天空中'],['the','shepherds','牧羊人'],['loves','you','愛你'],['the','world','世界']]
const PHPIC={news:'📜',star:'🌟',Jesus:'manger1',trip:'🫏',Son:'👶',gift:'🎁',care:'❤️',dream:'💭',manger:'manger1',stable:'stable',sky:'🌌',shepherds:'shep',you:'💞',world:'🌍'};
function phraseQ(){const p=rnd(PHR),blankFirst=Math.random()<.5,ans=blankFirst?p[0]:p[1],col=blankFirst?0:1;
  const opts=shuffle([ans,...shuffle([...new Set(PHR.map(x=>x[col]).filter(x=>x!==ans))]).slice(0,2)]);
  const show=blankFirst?`<u>　　　</u> ${p[1]}`:`${p[0]} <u>　　　</u>`;
  return {ins:'片語拼拼樂：兩個字合在一起，選出缺的那個字。',p:`<div style="font-size:clamp(40px,11vmin,64px)">${evPic([PHPIC[p[1]]||'✨'])}</div><div class="speech en" style="font-size:clamp(26px,7vmin,42px)">${show}</div><div class="zhLine">${p[2]}</div>`,
    lead:[{t:p[2],mean:1,gap:400}],read:1,cls:'sent',o:opts.map(x=>({h:x,s:x,ok:x===ans})),after:`${p[0]} ${p[1]}`}}
/* 缺了哪個字母？ */
const MISS=VOC.map(v=>v.w).filter(w=>/^[A-Za-z]+$/.test(w)&&w.length>=3);
function missQ(w0){const w=w0||rnd(MISS),i=1+(Math.random()*(w.length-1)|0),c=w[i].toLowerCase();
  const pool='abcdefghijklmnoprstuvwy'.split('').filter(x=>x!==c),opts=shuffle([c,...shuffle(pool).slice(0,2)]);
  return {ins:'這個字少了一個字母，是哪一個？',p:`${cpic(w)?cpic(w).replace('class="item ','class="item sm '):''}<div class="speech en" style="font-size:clamp(32px,9vmin,56px);letter-spacing:4px">${w.slice(0,i)}<span style="color:var(--red)">_</span>${w.slice(i+1)}</div><div class="zhLine">${CZ[w]||(VW[w]&&VW[w].z)||''}</div>`,
    lead:[{t:w,gap:400},{t:CZ[w]||(VW[w]&&VW[w].z)||'',mean:1,gap:400}],cls:'tile',o:opts.map(x=>({h:`<span class="en" style="font-size:clamp(28px,8vmin,44px)">${x}</span>`,s:LN(x),ok:x===c})),read:1}}

  const rk=G.teams.slice().sort((a,b)=>b.s-a.s),top=rk[0].s,win=rk.filter(t=>t.s===top);
  const ov=$('#ov'),pn=$('#ovPanel');ov.hidden=false;
  pn.innerHTML=`<div class="big">比賽結束！</div><div class="rank">${rk.map((t,i)=>`<div style="background:${t.c};border:3px solid ${K};border-radius:14px;padding:6px 12px;margin:5px 0;font-weight:900;font-size:20px">${['🥇','🥈','🥉','🏅'][i]} ${t.n}　⭐ ${t.s}</div>`).join('')}</div><div class="row"><button class="wb green" id="gAgain">再比一次</button><button class="tb back" id="gHome">回首頁</button></div>`;
  say([{t:win.length>1?`${win.map(t=>t.n).join('和')}一樣多，都是冠軍！`:`${win[0].n}得到冠軍！大家都很棒！`,zh:1}]);
  $('#gAgain').onclick=()=>{ov.hidden=true;startGroup(G.teams.length)};$('#gHome').onclick=goHome}

/* ================= 換到瀏覽器（LINE、Facebook 裡面） ================= */
const QK=['go','lv','nm','bd','openExternalBrowser'];
function extUrl(extra){const u=new URL(location.href.split('#')[0]);QK.forEach(k=>u.searchParams.delete(k));
  if(extra)Object.keys(extra).forEach(k=>{const v=extra[k];if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v)});return u.toString()}
const toChrome=u=>{location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end'};
function openExt(extra){extra=Object.assign({nm:G.name,bd:G.buddy},extra||{});const u=extUrl(extra);
  if(/\bLine\//i.test(UA)){location.href=u+(u.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';return}
  if(/Android/i.test(UA)){toChrome(u);return}
  extHelp(u)}
function extHelp(u){const ios=/iPhone|iPad|iPod/i.test(UA),ov=$('#ov'),pn=$('#ovPanel');ov.hidden=false;
  pn.innerHTML=`<div style="font-size:48px">🌐</div><div class="big">請用瀏覽器開啟</div><p style="line-height:1.8">${ios?'請按畫面右下角或右上角的「⋯」或「分享」，<br>選「用 Safari 開啟」。':'請按右上角的「⋮」，選「用瀏覽器開啟」。'}<br>也可以按「複製網址」，貼到 Safari 或 Chrome。</p><div class="row"><button class="wb green" id="ehc">複製網址</button><button class="tb back" id="ehx">先在這裡玩</button></div>`;
  $('#ehc').onclick=()=>{const ok=()=>{$('#ehc').textContent='網址已複製'};
    try{navigator.clipboard.writeText(u).then(ok,()=>prompt('請複製這個網址',u))}catch(e){prompt('請複製這個網址',u)}};
  $('#ehx').onclick=()=>{G.stayHere=true;ov.hidden=true;if(G.screen==='home')showMap(true)}}

/* ================= 首頁按鈕、封面、開機 ================= */
function goMapBtn(){readName();hush();if(INAPP&&!G.stayHere){openExt({go:'start'});return}showMap(true)}
$('#goMap').onclick=goMapBtn;
$('#goGroup').onclick=()=>{readName();groupSetup()};
$('#coverHouse').innerHTML=nativityHouse();
let needUnlock=false;
document.addEventListener('click',e=>{if(!needUnlock)return;needUnlock=false;
  if(e.target.closest&&e.target.closest('button'))return;
  setTimeout(()=>{if(G.screen==='map'||G.screen==='game'){hush();G.onReplay?G.onReplay():say(G.promptItems)}},150)},{capture:true});
(function boot(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){q=null}
  const go=q&&q.get('go'),failed=q&&LINEISH&&q.get('openExternalBrowser')!==null;
  if(q&&q.get('nm')!==null){G.name=q.get('nm').slice(0,8);store.set('bible1name',G.name)}
  if(q&&q.get('bd')!==null&&BUDDIES[+q.get('bd')]){G.buddy=+q.get('bd');store.set('bible1buddy',G.buddy)}
  const lv=q?Math.max(0,Math.min(LV.length-1,+q.get('lv')||0)):0;
  try{const u=new URL(location.href);QK.forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.toString())}catch(e){}
  updVoice();
  if(failed){const ex={go};if(go==='trace')ex.lv=lv;show('home',{});renderBuddies();$('#nameIn').value=G.name;
    const u=extUrl(Object.assign({nm:G.name,bd:G.buddy},ex));if(/Android/i.test(UA))toChrome(u);else extHelp(u);return}
  if(go&&!INAPP&&(go==='start'||go==='trace')){needUnlock=true;
    if(go==='trace'){for(let i=0;i<lv;i++)G.cleared[i]=1;startLevel(lv)}else showMap(true);return}
  show('cover',null);
  let done=false;const start=()=>{if(done)return;done=true;goHome()};
  $('#cover').onclick=start;
})();
</script>
</body>
